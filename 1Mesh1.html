<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --glass: rgba(6, 10, 35, 0.55); --glass-border: rgba(0, 240, 255, 0.45); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px; z-index: 100; width: 340px; max-height: 92vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0, 240, 255, 0.2); }
    button { background: rgba(0, 240, 255, 0.18); border: 1px solid var(--glass-border); color: #fff; padding: 13px; margin: 6px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; transition: all 0.25s; }
    button:hover { background: rgba(0, 240, 255, 0.4); transform: scale(1.04); }
    #toggle-ui { position: fixed; top: 20px; left: 20px; z-index: 101; background: #ff00aa; border: none; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; font-size: 26px; }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 12px 0; color: var(--electric-blue); font-size: 1.3rem; text-shadow: 0 0 15px var(--electric-blue); }
    #projector-lens { width: 100%; height: 235px; background: #000; border: 1px solid var(--glass-border); border-radius: 12px; margin: 12px 0; position: relative; }
    #chat-container { height: 135px; overflow-y: auto; background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); padding: 10px; font-size: 12.5px; margin: 10px 0; }
    #upload-modal { position: fixed; top: 18%; left: 35%; width: 360px; background: rgba(8,10,40,0.95); backdrop-filter: blur(22px); border: 2px solid var(--electric-blue); z-index: 300; color: #fff; border-radius: 18px; padding: 25px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" background="color: #000000">
      <a-assets>
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
      </a-assets>
      <a-sky id="sky" src="#bg-video" rotation="0 -90 0" animation="property: rotation; from: 0 -90 0; to: 0 270 0; loop: true; dur: 90000; easing: linear"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:12px; font-size:1.35rem; color:var(--electric-blue);">TIFFY MESH TERMINAL</div>
    
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>

    <input type="text" id="peer-id-input" placeholder="Peer ID..." style="width:100%; padding:10px; background:rgba(0,0,0,0.5); border:1px solid var(--glass-border); color:#fff; border-radius:10px; margin-bottom:5px;">
    <button onclick="initiatePeerSession(document.getElementById('peer-id-input').value.trim())">CONNECT & SYNC</button>

    <iframe id="projector-lens" allowfullscreen="true"></iframe>

    <div style="display:flex; gap:8px;">
      <button onclick="loadHome()">HOME</button>
      <button onclick="clearViewer()" style="background:rgba(200,0,0,0.4);">CLEAR</button>
    </div>

    <button onclick="showDeployModal()">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/v6.html', '_blank')">EDIT STORE</button>
    
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type message..." style="width:100%; padding:9px; background:rgba(0,0,0,0.5); border:1px solid var(--glass-border); border-radius:8px;">
    
    <button onclick="stopVideoCall()" style="background:rgba(180,0,0,0.5);">⛔ STOP VIDEO</button>
    <button onclick="clearChat()" style="background:#333; font-size:11px;">CLEAR CHAT</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3 style="color:var(--electric-blue);">DEPLOY STORE</h3>
    <input type="text" id="name-input" placeholder="Store Name" style="width:100%; padding:10px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid var(--glass-border); color:#fff;">
    <input type="file" id="thumb-input" accept="image/*" style="width:100%; margin:6px 0;">
    <input type="file" id="html-input" accept=".html" style="width:100%; margin:6px 0;">
    <button onclick="deployStore()" id="deploy-btn">CONFIRM & DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

<script>
  const DB_NAME = 'TiffyStoreDB', STORE_NAME = 'StoreData';
  let meshDir = {}, activeCall = null, localStream = null;
  const peer = new Peer();

  async function getDB() { return new Promise(r => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME); req.onsuccess = e => r(e.target.result); }); }

  async function initiatePeerSession(targetPeerId) {
    if (!targetPeerId) return alert("Enter a Peer ID");
    
    // 1. Data Sync
    const conn = peer.connect(targetPeerId);
    conn.on('open', () => conn.send({ type: 'SYNC_DIR', data: meshDir }));
    conn.on('data', (data) => { if (data.type === 'SYNC_DIR') { Object.assign(meshDir, data.data); renderPortals(); } });

    // 2. Video Handshake
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    const call = peer.call(targetPeerId, localStream);
    call.on('stream', toggleVideoDisplay);
    activeCall = call;
  }

  peer.on('call', async (call) => {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    call.answer(localStream);
    call.on('stream', toggleVideoDisplay);
    activeCall = call;
  });

  function toggleVideoDisplay(stream) {
    let overlay = document.getElementById('video-overlay');
    if (!overlay) {
      overlay = document.createElement('video');
      overlay.id = 'video-overlay';
      overlay.autoplay = true; overlay.muted = true; overlay.playsinline = true;
      overlay.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; border-radius:12px; z-index:10; background:#000;';
      document.getElementById('projector-lens').parentElement.appendChild(overlay);
    }
    overlay.srcObject = stream;
  }

  function stopVideoCall() {
    if (activeCall) { activeCall.close(); activeCall = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    let vid = document.getElementById('video-overlay'); if (vid) vid.remove();
  }

  async function deployStore() {
    const name = document.getElementById('name-input').value.trim() || "My Store";
    const hFile = document.getElementById('html-input').files[0];
    const tFile = document.getElementById('thumb-input').files[0];
    const html = await hFile.text();
    const thumb = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(tFile); });
    meshDir[peer.id] = { id: peer.id, name, html, thumb };
    const db = await getDB();
    db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put(meshDir, 'MESH_DIR');
    renderPortals();
    alert("✅ Deployed!");
  }

  function renderPortals() {
    const container = document.getElementById('ar-portal');
    container.innerHTML = '';
    Object.values(meshDir).forEach((biz, i) => {
      const el = document.createElement('a-plane');
      el.setAttribute('position', `${(i * 1.8) - 1.5} 0.6 -2.5`);
      el.setAttribute('material', { src: biz.thumb });
      el.addEventListener('click', () => document.getElementById('projector-lens').src = URL.createObjectURL(new Blob([biz.html], {type: 'text/html'})));
      container.appendChild(el);
    });
  }

  function addChatMessage(msg) { document.getElementById('chat-container').innerHTML += `<div>> ${msg}</div>`; }
  document.getElementById('chat-input').addEventListener('keypress', e => { if (e.key === 'Enter') { addChatMessage(e.target.value); e.target.value = ''; } });
  function loadHome() { document.getElementById('projector-lens').src = 'https://tiffyai-usd.github.io/Web-Store-App/v6.html'; }
  function clearViewer() { document.getElementById('projector-lens').src = ''; }
  function clearChat() { document.getElementById('chat-container').innerHTML = ''; }
  function showDeployModal() { document.getElementById('upload-modal').classList.remove('hidden'); }

  window.onload = async () => {
    document.getElementById('bg-video').play().catch(() => {});
    const db = await getDB();
    db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get('MESH_DIR').onsuccess = (e) => { meshDir = e.target.result || {}; renderPortals(); };
  };
</script>
</body>
</html>
