<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>
<body>
    <a-scene embedded vr-mode-ui="enabled: false">
        <a-assets>
            <video id="bgvideo" src="Terminal1.mp4" autoplay loop="true" muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <a-sky id="background" src="#bgvideo"></a-sky>
        
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        // This is the logic at the bottom of your file that forces the render
        document.querySelector('a-scene').addEventListener('loaded', () => {
            const video = document.getElementById('bgvideo');
            video.play();
        });
    </script>
</body>
</html>
