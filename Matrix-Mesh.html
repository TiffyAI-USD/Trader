<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --glass: rgba(6, 10, 35, 0.55); --glass-border: rgba(0, 240, 255, 0.45); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px; z-index: 100; width: 340px; max-height: 92vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0, 240, 255, 0.2); }
    button { background: rgba(0, 240, 255, 0.18); border: 1px solid var(--glass-border); color: #fff; padding: 13px; margin: 6px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; transition: all 0.25s; }
    button:hover { background: rgba(0, 240, 255, 0.4); transform: scale(1.02); }
    #toggle-ui { position: fixed; top: 20px; left: 20px; z-index: 101; background: #ff00aa; border: none; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; font-size: 26px; }
    #search-suggestions { position: absolute; width: 304px; background: rgba(6, 10, 35, 0.95); border: 1px solid var(--electric-blue); border-radius: 0 0 15px 15px; z-index: 200; max-height: 200px; overflow-y: auto; animation: slideDown 0.3s ease-out forwards; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(0,240,255,0.2); transition: 0.2s; }
    .suggestion-item:hover { background: rgba(0, 240, 255, 0.2); padding-left: 20px; }
    #projector-lens { width: 100%; height: 235px; background: #000; border: 1px solid var(--glass-border); border-radius: 12px; margin: 12px 0; position: relative; }
    #chat-container { height: 100px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 5px; font-size: 11px; margin-bottom: 10px; border: 1px solid var(--glass-border); }
    #upload-modal { position: fixed; top: 18%; left: 35%; width: 360px; background: rgba(8,10,40,0.95); backdrop-filter: blur(22px); border: 2px solid var(--electric-blue); z-index: 300; color: #fff; border-radius: 18px; padding: 25px; }
    .hidden { display: none !important; }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 12px 0; color: var(--electric-blue); font-size: 1.3rem; text-shadow: 0 0 15px var(--electric-blue); }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-assets><video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video></a-assets>
      <a-sky id="sky" src="#bg-video" rotation="0 -90 0" animation="property: rotation; from: 0 -90 0; to: 0 270 0; loop: true; dur: 90000; easing: linear"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="text-align:center; color:var(--electric-blue); font-family:Orbitron; margin-bottom:10px;">TIFFY MESH TERMINAL</div>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>
    <input type="text" id="search-bar" placeholder="Search Mesh..." style="width:100%; padding:10px; background:rgba(0,0,0,0.5); border:1px solid var(--glass-border); color:#fff; border-radius:10px;">
    <button onclick="searchMesh()">SEARCH MATRIX</button>
    <div id="projector-lens"></div>
    <div style="display:flex; gap:8px;">
      <button onclick="loadHome()">HOME</button>
      <button onclick="clearViewer()" style="background:rgba(200,0,0,0.4);">CLEAR</button>
    </div>
    <button onclick="showDeployModal()">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/v6.html', '_blank')">EDIT STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')">BANKING</button>
    
    <div style="border-top:1px solid var(--glass-border); padding-top:10px; margin-top:10px;">
      <input type="text" id="peer-id-input" placeholder="Enter Peer ID..." style="width:100%; padding:8px; background:rgba(0,0,0,0.5); border:1px solid var(--electric-blue); color:#fff; border-radius:6px;">
      <button onclick="connectToPeer()" style="background:var(--electric-blue); color:#000;">CONNECT TO PEER</button>
      <div id="connection-status" style="font-size:10px; color:var(--electric-blue);">ID: LOADING...</div>
    </div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type message..." style="width:100%; padding:9px; background:rgba(0,0,0,0.5); border:1px solid var(--glass-border); border-radius:8px;">
    <button onclick="startVideoCall()">📹 START VIDEO</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3 style="color:var(--electric-blue);">DEPLOY STORE</h3>
    <input type="text" id="name-input" placeholder="Store Name" style="width:100%; padding:10px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid var(--glass-border); color:#fff;">
    <input type="file" id="thumb-input" accept="image/*" style="width:100%; margin:6px 0;">
    <input type="file" id="html-input" accept=".html" style="width:100%; margin:6px 0;">
    <button onclick="deployStore()" id="deploy-btn">CONFIRM & DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

<script>
  const peer = new Peer();
  let meshDir = {}, localStream = null;
  const DB_NAME = 'TiffyStoreDB', STORE_NAME = 'StoreData';

  // Database / Store Logic
  async function getDB() {
    return new Promise(r => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
      req.onsuccess = e => r(e.target.result);
    });
  }

  peer.on('open', (id) => document.getElementById('connection-status').textContent = `MY ID: ${id}`);

  // Psychic Search
  const searchBar = document.getElementById('search-bar');
  const suggestDiv = document.createElement('div');
  suggestDiv.id = 'search-suggestions';
  searchBar.parentNode.insertBefore(suggestDiv, searchBar.nextSibling);

  searchBar.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    suggestDiv.innerHTML = '';
    if (q.length < 2) return;
    Object.values(meshDir).filter(b => b.name?.toLowerCase().includes(q)).forEach(biz => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      item.textContent = biz.name;
      item.onclick = () => { searchBar.value = biz.name; suggestDiv.innerHTML = ''; searchMesh(); };
      suggestDiv.appendChild(item);
    });
  });

  // Gossip Engine
  function setupConnection(conn) {
    conn.on('open', () => { conn.send({ type: 'SYNC_DIR', data: meshDir }); addChatMessage(`Connected: ${conn.peer}`); });
    conn.on('data', (data) => {
      if (data.type === 'SYNC_DIR') { Object.assign(meshDir, data.data); renderPortals(); addChatMessage("Directory Synced."); }
    });
  }

  peer.on('connection', (conn) => setupConnection(conn));
  function connectToPeer() {
    const targetId = document.getElementById('peer-id-input').value.trim();
    if (targetId) setupConnection(peer.connect(targetId));
  }

  // Deploy / Video / UI Logic
  async function deployStore() {
    const name = document.getElementById('name-input').value || "Store";
    const hFile = document.getElementById('html-input').files[0];
    const tFile = document.getElementById('thumb-input').files[0];
    if (!hFile || !tFile) return alert("Files required");
    const html = await hFile.text();
    const thumb = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(tFile); });
    meshDir[peer.id] = { id: peer.id, name, html, thumb };
    const db = await getDB();
    db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put(meshDir, 'MESH_DIR');
    renderPortals();
    alert("Deployed!");
  }

  peer.on('call', (call) => {
    navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(s => { call.answer(s); call.on('stream', showVideo); });
  });

  async function startVideoCall() {
    const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
    const call = peer.call(document.getElementById('peer-id-input').value, stream);
    call.on('stream', showVideo);
  }

  function showVideo(stream) {
    const vid = document.createElement('video');
    vid.srcObject = stream; vid.autoplay = true; vid.style.width = '100%';
    const lens = document.getElementById('projector-lens');
    lens.innerHTML = ''; lens.appendChild(vid);
  }

  function renderPortals() {
    const container = document.getElementById('ar-portal');
    container.innerHTML = '';
    Object.values(meshDir).forEach((biz, i) => {
      const el = document.createElement('a-plane');
      el.setAttribute('position', `${(i * 1.8) - 1.5} 0.6 -2.5`);
      el.setAttribute('material', {src: biz.thumb});
      el.addEventListener('click', () => { 
        const blob = new Blob([biz.html], {type: 'text/html'});
        document.getElementById('projector-lens').innerHTML = `<iframe src="${URL.createObjectURL(blob)}" style="width:100%;height:100%;"></iframe>`;
      });
      container.appendChild(el);
    });
  }

  function searchMesh() {
    const found = Object.values(meshDir).find(b => b.name?.toLowerCase() === searchBar.value.toLowerCase());
    if (found) { 
        const blob = new Blob([found.html], {type: 'text/html'});
        document.getElementById('projector-lens').innerHTML = `<iframe src="${URL.createObjectURL(blob)}" style="width:100%;height:100%;"></iframe>`;
    }
  }

  function addChatMessage(msg) { document.getElementById('chat-container').innerHTML += `<div>> ${msg}</div>`; }
  function loadHome() { document.getElementById('projector-lens').innerHTML = '<iframe src="https://tiffyai-usd.github.io/Web-Store-App/v6.html" style="width:100%;height:100%;"></iframe>'; }
  function clearViewer() { document.getElementById('projector-lens').innerHTML = ''; }
  function showDeployModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
  
  window.onload = async () => {
    const db = await getDB();
    const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get('MESH_DIR');
    req.onsuccess = () => { meshDir = req.result || {}; renderPortals(); };
    document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
    document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
  };
</script>
</body>
</html>
