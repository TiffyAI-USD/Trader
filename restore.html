<!DOCTYPE html>
<html>
<body>
    <script>
        // 1. PURGE: Remove every key I injected that is causing the conflicts
        const rogueKeys = ['pending_store_upload', 'KYC_Verified_Hash', 'master_file_state'];
        rogueKeys.forEach(key => localStorage.removeItem(key));

        // 2. RESTORE: This function forces the browser to commit the builder's state 
        // to the key your other 20 files are looking for.
        function forceRestore(data) {
            localStorage.setItem('sovereign_live_site', data);
            console.log('Restored persistence to sovereign_live_site');
            alert('Persistence restored. Refresh your original File 3.');
        }

        // 3. AUTO-LOAD: If you have a file to restore, load it here.
        // If the storage was empty, this confirms it is ready to receive your builder's data.
        window.onload = () => {
            const current = localStorage.getItem('sovereign_live_site');
            if (current) {
                console.log('Storage is active and holding data.');
            } else {
                console.log('Storage is clear and ready for your Builder.');
            }
        };
    </script>
</body>
</html>
