<!DOCTYPE html>
<html>
<head>
    <style>
        /* Your original aesthetic */
        body { font-family: 'Bebas Neue', sans-serif; background: #25D366; } /* WhatsApp Green */
        #projector-lens { width: 100%; height: 80vh; border: 2px solid gold; }
    </style>
</head>
<body>

<!-- The Import Button -->
<input type="file" id="prod-upload" style="display:none;" onchange="handleImport(event)">
<button onclick="document.getElementById('prod-upload').click()">IMPORT WEBSTORE</button>

<!-- The Viewer -->
<iframe id="projector-lens"></iframe>

<script>
    // Priority: The Viewer reads from the storage set by your Builder
    function updateViewer() {
        const storedSite = localStorage.getItem('sovereign_live_site');
        if (storedSite) {
            document.getElementById('projector-lens').srcdoc = storedSite;
        }
    }

    // Logic: Import button injects into the lens without overriding the main builder logic
    function handleImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('projector-lens').srcdoc = e.target.result;
        };
        reader.readAsText(file);
    }

    // Initial load
    updateViewer();
</script>
</body>
</html>
