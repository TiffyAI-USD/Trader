<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; --gold: #d4a373; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; transition: all 0.3s ease; }
    #ui-panel.hidden { transform: translateX(350px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    #projector-lens { width: 100%; height: 450px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 8px 0; color: var(--shocking-pink); }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 4px 0; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false"><a-camera position="0 1.6 0"></a-camera></a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    
    <iframe id="projector-lens"></iframe>

    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')" style="background: #28a745;">OPEN BUILDER</button>
    <button onclick="refreshLivePreview()" style="background: var(--gold); color: #000;">REFRESH LIVE PREVIEW</button>
    
    <div style="margin-top:20px; font-size:11px; color:#aaa;">SYSTEM: HANDSHAKE ACTIVE</div>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');

    // This pulls the state directly from your Builder's storage key
    function refreshLivePreview() {
        const rawData = localStorage.getItem('webstore_pro_draft');
        if (!rawData) return;
        
        const state = JSON.parse(rawData);
        const stateInjection = `<script>const INITIAL_STATE = ${JSON.stringify(state)};<\/script>`;
        
        // This simulates the exact download logic, but injects it into the iframe instead of downloading
        fetch('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html')
            .then(res => res.text())
            .then(html => {
                const finalHtml = html.replace('</head>', stateInjection + '</head>');
                const blob = new Blob([finalHtml], { type: 'text/html' });
                projector.src = URL.createObjectURL(blob);
            });
    }

    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');

    window.onload = () => {
        refreshLivePreview();
        // Listen for changes from the builder if it's on the same origin/storage
        window.addEventListener('storage', (e) => {
            if(e.key === 'webstore_pro_draft') refreshLivePreview();
        });
    };
  </script>
</body>
</html>
