<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TIFFYVERSE • Sovereign Engine</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #ui-panel { position: absolute; top: 20px; right: 20px; width: 320px; background: rgba(0, 0, 0, 0.9); border: 2px solid #007BFF; padding: 20px; color: #fff; z-index: 9999; border-radius: 20px; transition: transform 0.3s; }
        #ui-panel.hidden { transform: translateX(400px); }
        #toggle-btn { position: absolute; top: 20px; right: 20px; z-index: 10000; background: #FF007F; border: none; color: white; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        #projector-lens { width: 100%; height: 200px; background: #fff; border: 1px solid #444; border-radius: 8px; margin: 10px 0; overflow: hidden; }
        .stat-row { font-family: 'Orbitron', sans-serif; color: #FF007F; margin: 5px 0; }
        #chat-container { height: 100px; overflow-y: auto; background: #111; border: 1px solid #444; padding: 8px; font-size: 11px; margin-bottom: 5px; }
    </style>
</head>
<body>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-entity camera look-controls wasd-controls position="0 1.6 0"><a-cursor></a-cursor></a-entity>
    <a-entity id="marketplace-root"></a-entity>
</a-scene>

<button id="toggle-btn" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">MENU</button>

<div id="ui-panel">
    <h3>TIFFYVERSE</h3>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>
    <iframe id="projector-lens"></iframe>
    <button onclick="publishToVerse()" style="width:100%; padding:12px; background:#FF007F; border:none; border-radius:8px; color:white; cursor:pointer;">PUBLISH TO T-VERSE</button>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Chat..." style="width:100%; padding:8px;" onkeypress="handleChat(event)">
</div>

<script>
    function compileBackground() {
        const storedHtml = localStorage.getItem('Prepped_HTML_Buffer');
        if (!storedHtml) return;

        const projector = document.getElementById('projector-lens');
        if (projector && projector.srcdoc !== storedHtml) {
            projector.srcdoc = storedHtml;
        }
    }

    function renderMarketplace() {
        const root = document.getElementById('marketplace-root');
        
        if (root.querySelector('.clickable')) return; 

        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('class', 'clickable');
        sphere.setAttribute('color', '#007BFF');
        sphere.setAttribute('radius', '0.4');
        sphere.setAttribute('position', '0 1.5 -3');
        
        sphere.addEventListener('click', () => {
            const prepped = localStorage.getItem('Prepped_HTML_Buffer');
            if(prepped) document.getElementById('projector-lens').srcdoc = prepped;
        });
        
        root.appendChild(sphere);
    }

    function handleChat(e) {
        if (e.key === 'Enter' && e.target.value) {
            const hist = (localStorage.getItem('terminal_chat_history') || '') + `<div><b>You:</b> ${e.target.value}</div>`;
            localStorage.setItem('terminal_chat_history', hist);
            document.getElementById('chat-container').innerHTML = hist;
            e.target.value = '';
        }
    }

    function publishToVerse() {
        const html = localStorage.getItem('Prepped_HTML_Buffer');
        const kyc = localStorage.getItem("KYC_Verified_Hash");
        if(html && kyc) { 
            localStorage.setItem(kyc + "_Webpage", html); 
            alert("Published!"); 
        } else {
            alert("Missing Data: Build store first.");
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const tiffyEl = document.getElementById('tiffy-counter');
        const tusdEl = document.getElementById('tusd-counter');
        const chatEl = document.getElementById('chat-container');
        
        if (tiffyEl) tiffyEl.innerText = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
        if (tusdEl) tusdEl.innerText = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
        if (chatEl) chatEl.innerHTML = localStorage.getItem('terminal_chat_history') || '';
        
        compileBackground();
        renderMarketplace();
        setInterval(compileBackground, 2000);
    });
</script>
</body>
</html>
