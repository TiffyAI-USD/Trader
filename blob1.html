<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Beacon & Blob Sync Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h2 { margin: 0 0 8px 0; color: #38bdf8; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            background: #eab308;
            color: #1e293b;
            margin-bottom: 12px;
        }
        .status-badge.connected {
            background: #22c55e;
            color: white;
        }
        .log-container {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div>
        <h2>Store Beacon & Blob Messaging Bridge</h2>
        <p style="color: #94a3b8; margin: 0;">Local Storage P2P Bridge Test</p>
    </div>

    <div class="card">
        <div id="statusBadge" class="status-badge">Beacon Active - Waiting for Peer...</div>
        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 6px;">Connection Activity Log:</div>
        <div id="logContainer" class="log-container"></div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; font-size: 16px; color: #e2e8f0;">Send Translated JSON Blob Message</h3>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Type a message to blob and sync...">
            <button id="sendBtn" onclick="sendBlobMessage()">Send Blob</button>
        </div>
    </div>

<script>
    // 1. Persistent Client ID (Stays the same even on refresh if stored)
    let clientId = localStorage.getItem('store_client_id');
    if (!clientId) {
        clientId = 'Client_' + Math.random().toString(36).substring(2, 7);
        localStorage.setItem('store_client_id', clientId);
    }

    let isConnected = false;
    let peerId = null;

    const logContainer = document.getElementById('logContainer');
    const statusBadge = document.getElementById('statusBadge');
    const messageInput = document.getElementById('messageInput');

    function log(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const color = type === 'success' ? '#34d399' : type === 'error' ? '#f87171' : '#a7f3d0';
        logContainer.innerHTML += `<div style="color: ${color}">[${timestamp}] [${clientId}] ${message}</div>`;
        logContainer.scrollTop = logContainer.scrollHeight;
    }

    log(`Beacon initialized. Persistent ID locked: ${clientId}`);

    // 2. Broadcast via window storage events (Works across all tabs/files seamlessly)
    function broadcast(action) {
        const payload = {
            ...action,
            sender: clientId,
            nonce: Math.random() // Forces storage event to trigger even if data looks identical
        };
        localStorage.setItem('store_network_bus', JSON.stringify(payload));
    }

    // Start Ping loop
    const pingInterval = setInterval(() => {
        log("📡 Emitting Beacon PING...");
        broadcast({ type: 'PING' });
    }, 2000);

    // 3. Listen to cross-tab storage messages
    window.addEventListener('storage', async (event) => {
        if (event.key !== 'store_network_bus' || !event.newValue) return;

        let data;
        try {
            data = JSON.parse(event.newValue);
        } catch (e) {
            return;
        }

        const { type, sender, payload } = data;
        if (sender === clientId) return; // Ignore our own messages

        if (type === 'PING') {
            log(`📥 Received PING from peer: ${sender}. Replying with PONG.`);
            broadcast({ type: 'PONG', target: sender });
            establishConnection(sender);
        }
        else if (type === 'PONG') {
            log(`📥 Received PONG from peer: ${sender}. Handshake confirmed!`);
            establishConnection(sender);
        }
        else if (type === 'BLOB_SYNC') {
            log(`📦 Received raw binary blob payload from ${sender}. Unpacking...`);
            
            // Translate binary blob back to readable text / JSON
            const textData = await payload.text();
            const json = JSON.parse(textData);
            
            log(`✨ Successfully translated blob into JSON: "${json.text}" (Simulated IP: ${json.ip})`, 'success');
        }
    });

    function establishConnection(targetPeer) {
        if (!isConnected) {
            isConnected = true;
            peerId = targetPeer;
            clearInterval(pingInterval); // Stop spamming pings once locked
            
            statusBadge.className = "status-badge connected";
            statusBadge.innerText = `Connected to Peer: ${peerId}`;
            
            log(`✅ Connection bridge successfully locked with ${peerId}!`, 'success');
        }
    }

    // 4. Package and Send as a Translated Binary Blob
    async function sendBlobMessage() {
        const textVal = messageInput.value.trim();
        if (!textVal) return;

        log(`OUTGOING: Packaging message into JSON structure...`);
        const messageObject = {
            sender: clientId,
            ip: "192.168.1." + Math.floor(Math.random() * 200 + 10),
            text: textVal,
            timestamp: Date.now()
        };

        const jsonString = JSON.stringify(messageObject);

        log(`OUTGOING: Converting JSON text to binary Blob...`);
        const binaryBlob = new Blob([jsonString], { type: 'application/json' });

        log(`OUTGOING: Transmitting blob across local storage bridge...`);
        broadcast({
            type: 'BLOB_SYNC',
            payload: binaryBlob
        });

        log(`🚀 Blob successfully transmitted!`, 'success');
        messageInput.value = '';
    }
</script>

</body>
</html>
