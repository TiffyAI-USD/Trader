<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; margin: 0; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; transition: transform 0.3s; }
    #ui-panel.hidden { transform: translateX(350px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); border-radius: 50%; width: 40px; height: 40px; border: none; color: #fff; cursor: pointer; }
    #projector-lens { width: 100%; height: 250px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 4px 0; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="text-align:center; margin-bottom:10px;">TIFFY MESH TERMINAL</div>
    <input type="text" id="search-bar" placeholder="Search Business..." style="width:100%; padding:8px; background:#111; color:#fff; border:1px solid #444;">
    <button onclick="searchBusiness()">SEARCH</button>
    
    <iframe id="projector-lens"></iframe>
    <button onclick="loadHome()" style="background:#666;">HOME</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const arPortal = document.getElementById('ar-portal');
    const peer = new Peer(); // Unique ID for this node
    let connections = [];
    let tiffyDirectory = JSON.parse(localStorage.getItem('TIFFY_DIRECTORY') || '{}');

    function getLocalBusinessProfile() {
        const draft = localStorage.getItem('webstore_pro_draft');
        if (!draft) return null;
        const d = JSON.parse(draft);
        return { id: peer.id, name: d.name, thumb: d.logo, data: draft };
    }

    function renderAllPortals() {
        arPortal.innerHTML = '';
        Object.values(tiffyDirectory).forEach((biz, i) => {
            const el = document.createElement('a-plane');
            el.setAttribute('position', `${(i * 2) - 2} 0 0`);
            el.setAttribute('material', `src: url(${biz.thumb}); side: double`);
            el.addEventListener('click', () => {
                const blob = new Blob([biz.data], {type: 'text/html'});
                projector.src = URL.createObjectURL(blob);
            });
            arPortal.appendChild(el);
        });
    }

    function searchBusiness() {
        const q = document.getElementById('search-bar').value.toLowerCase();
        const match = Object.values(tiffyDirectory).find(b => b.name?.toLowerCase().includes(q));
        if (match) {
            const blob = new Blob([match.data], {type: 'text/html'});
            projector.src = URL.createObjectURL(blob);
        } else alert("Not in mesh.");
    }

    peer.on('open', () => {
        // Broadcast presence when mesh connects
        const profile = getLocalBusinessProfile();
        if (profile) {
            tiffyDirectory[peer.id] = profile;
            connections.forEach(c => c.send({ type: 'PRESENCE', profile }));
            renderAllPortals();
        }
    });

    peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (d) => {
            if(d.type === 'PRESENCE') {
                tiffyDirectory[d.profile.id] = d.profile;
                localStorage.setItem('TIFFY_DIRECTORY', JSON.stringify(tiffyDirectory));
                renderAllPortals();
            }
        });
    });

    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');
    window.onload = renderAllPortals;
    function loadHome() { projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html'; }
  </script>
</body>
</html>
