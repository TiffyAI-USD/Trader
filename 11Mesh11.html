<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --glass: rgba(6, 10, 35, 0.75); --glass-border: rgba(0, 240, 255, 0.5); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: var(--glass); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 25px; z-index: 100; width: 380px; max-height: 95vh; overflow-y: auto; box-shadow: 0 0 80px rgba(0, 240, 255, 0.25); }
    button { background: rgba(0, 240, 255, 0.15); border: 1px solid var(--glass-border); color: #fff; padding: 14px; margin: 8px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: 700; transition: all 0.3s; }
    button:hover { background: rgba(0, 240, 255, 0.45); transform: translateY(-2px); }
    .node-card { padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.08); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px; }
    .active { background: #00ff00; }
    .busy { background: #ff00ff; }
    #projector-lens { width: 100%; height: 220px; background: #000; border: 1px solid var(--glass-border); border-radius: 15px; margin: 15px 0; position: relative; }
    #upload-modal { position: fixed; top: 15%; left: 30%; width: 420px; background: #080a1a; border: 2px solid var(--electric-blue); z-index: 600; padding: 30px; border-radius: 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-nodes" position="0 1.5 -5"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; font-size:1.4rem; color:var(--electric-blue); margin-bottom:15px;">SOVEREIGN MESH TERMINAL</div>
    <div id="peer-list"><h3>MESH NODES</h3></div>
    <div id="projector-lens"></div>
    <button onclick="setStatus('ACTIVE')">SET STATUS: ACTIVE</button>
    <button onclick="setStatus('BUSY')" style="background:rgba(255,0,255,0.2);">SET STATUS: BUSY</button>
    <button onclick="showUpload()">DEPLOY STORE NODE</button>
    <div id="chat-container"></div>
  </div>

  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <input type="text" id="name-input" placeholder="Store Name" style="width:100%; padding:10px; margin:10px 0; background:#000; color:#fff; border:1px solid #444;">
    <input type="file" id="thumb-input" style="width:100%; margin:5px 0;">
    <button onclick="deployStore()">COMMIT TO MESH</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">DISMISS</button>
  </div>

<script>
  const DB_NAME = 'TiffyStoreDB', STORE_NAME = 'StoreData';
  let peer = new Peer(), meshDir = {}, myStatus = 'ACTIVE', activeCall = null;

  async function getDB() { return new Promise(r => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME); req.onsuccess = e => r(e.target.result); }); }

  // 1. Presence & Heartbeat
  function startHeartbeat() {
    setInterval(async () => {
      // Logic for broadcasting presence to mesh and updating directory
      updateNodeList();
    }, 3000);
  }

  function updateNodeList() {
    const list = document.getElementById('peer-list');
    list.innerHTML = '<h3>ACTIVE MESH NODES</h3>';
    Object.entries(meshDir).forEach(([id, data]) => {
      const div = document.createElement('div');
      div.className = 'node-card';
      div.innerHTML = `<span>${id.substring(0,8)}</span> <span class="status-dot ${data.status.toLowerCase()}"></span>`;
      div.onclick = () => initiateConnection(id);
      list.appendChild(div);
    });
  }

  // 2. Peer Handshake & Video
  async function initiateConnection(targetId) {
    if (targetId === peer.id) return;
    const conn = peer.connect(targetId);
    conn.on('open', () => conn.send({ type: 'SYNC', data: meshDir }));
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    activeCall = peer.call(targetId, stream);
    activeCall.on('stream', s => playVideo(s));
  }

  peer.on('call', async call => {
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    call.answer(stream);
    call.on('stream', s => playVideo(s));
    activeCall = call;
  });

  function playVideo(s) {
    let v = document.getElementById('video-overlay') || document.createElement('video');
    v.id = 'video-overlay'; v.autoplay = true; v.muted = true;
    v.style.cssText = 'width:100%; height:100%; object-fit:cover; border-radius:15px;';
    v.srcObject = s;
    const lens = document.getElementById('projector-lens');
    lens.innerHTML = ''; lens.appendChild(v);
  }

  // 3. Persistence & Store Management
  async function deployStore() {
    const name = document.getElementById('name-input').value;
    const tFile = document.getElementById('thumb-input').files[0];
    if(!tFile) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      meshDir[peer.id] = { id: peer.id, name, status: myStatus, thumb: e.target.result };
      const db = await getDB();
      db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put(meshDir, 'MESH_DIR');
      alert("Store Committed");
    };
    reader.readAsDataURL(tFile);
  }

  function setStatus(s) { 
    myStatus = s; 
    if(meshDir[peer.id]) meshDir[peer.id].status = s;
    updateNodeList(); 
  }

  function showUpload() { document.getElementById('upload-modal').classList.remove('hidden'); }

  window.onload = async () => {
    peer.on('open', id => { 
      meshDir[id] = { status: 'ACTIVE' }; 
      updateNodeList(); 
    });
    
    const db = await getDB();
    const tx = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get('MESH_DIR');
    tx.onsuccess = (e) => { if(e.target.result) meshDir = e.target.result; updateNodeList(); };
    
    startHeartbeat();
  };
</script>
</body>
</html>
