<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { 
      --electric-blue: #00f0ff; 
      --glass: rgba(6, 10, 35, 0.55); 
      --glass-border: rgba(0, 240, 255, 0.45);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }

    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    #ui-panel { 
      position: fixed; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: var(--glass); 
      backdrop-filter: blur(24px); 
      border: 1px solid var(--glass-border); 
      border-radius: 20px; 
      padding: 18px; 
      z-index: 100; 
      width: 340px; 
      max-height: 92vh; 
      overflow-y: auto; 
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
      position: relative;
    }

    button { 
      background: rgba(0, 240, 255, 0.18); 
      border: 1px solid var(--glass-border); 
      color: #fff; 
      padding: 13px; 
      margin: 6px 0; 
      border-radius: 12px; 
      width: 100%; 
      cursor: pointer; 
      font-weight: bold; 
      transition: all 0.25s;
    }
    button:hover { background: rgba(0, 240, 255, 0.4); transform: scale(1.04); }

    #toggle-ui { 
      position: fixed; top: 20px; left: 20px; z-index: 101; 
      background: #ff00aa; border: none; 
      width: 52px; height: 52px; border-radius: 50%; 
      cursor: pointer; font-size: 26px; 
    }

    .stat-row { 
      font-family: 'Orbitron', sans-serif; 
      text-align: center; 
      margin: 12px 0; 
      color: var(--electric-blue); 
      font-size: 1.3rem; 
      text-shadow: 0 0 15px var(--electric-blue);
    }

    #projector-lens { width: 100%; height: 235px; background: #000; border: 1px solid var(--glass-border); border-radius: 12px; margin: 12px 0; }

    #chat-container { 
      height: 135px; overflow-y: auto; background: rgba(0,0,0,0.6); 
      border: 1px solid var(--glass-border); padding: 10px; font-size: 12.5px; margin: 10px 0; 
    }

    #upload-modal { 
      position: fixed; top: 18%; left: 35%; width: 360px; 
      background: rgba(8,10,40,0.95); backdrop-filter: blur(22px); 
      border: 2px solid var(--electric-blue); 
      z-index: 300; color: #fff; border-radius: 18px; padding: 25px; 
    }

    #search-suggestions {
      position: absolute; 
      top: 100%; 
      left: 0; 
      width: 100%; 
      background: rgba(6, 10, 35, 0.95);
      backdrop-filter: blur(18px); 
      border: 1px solid var(--electric-blue);
      border-radius: 0 0 15px 15px; 
      z-index: 250; 
      max-height: 260px;
      overflow-y: auto; 
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.4);
    }
    .suggestion-item { 
      padding: 12px 15px; 
      cursor: pointer; 
      border-bottom: 1px solid rgba(0,240,255,0.2); 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .suggestion-item:hover { 
      background: rgba(0, 240, 255, 0.3); 
      color: var(--electric-blue); 
    }
    .status-dot {
      width: 12px; height: 12px; border-radius: 50%; margin-left: 8px;
    }
    .active { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
    .busy { background: #ffdd00; box-shadow: 0 0 8px #ffdd00; }
    .disconnected { background: #888; }
    .hidden { display: none !important; }
    
    #online-members-container {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" background="color: #000000">
      <a-assets>
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous"
               src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
      </a-assets>
      <a-sky id="sky" src="#bg-video" rotation="0 -90 0" animation="property: rotation; from: 0 -90 0; to: 0 270 0; loop: true; dur: 90000; easing: linear"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel" style="position: relative;">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:12px; font-size:1.35rem; color:var(--electric-blue);">TIFFY MESH TERMINAL</div>
    
    <!-- ONLINE MEMBERS SECTION -->
    <div id="online-members-container">
      <div style="font-size: 10px; color: #888; margin-bottom: 5px;">ONLINE MEMBERS</div>
      <div id="online-members-list"></div>
    </div>
    
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>

    <div style="position: relative; margin-bottom: 8px;">
      <input type="text" id="search-bar" placeholder="Search Mesh..." style="width:100%; padding:10px; background:rgba(0,0,0,0.4); color:#fff; border:1px solid var(--glass-border); border-radius:10px;">
      <div id="search-suggestions"></div>
    </div>
    
    <button onclick="searchMesh()">SEARCH MATRIX</button>

    <iframe id="projector-lens" allowfullscreen="true"></iframe>

    <div style="display:flex; gap:8px;">
      <button onclick="loadHome()">HOME</button>
      <button onclick="clearViewer()" style="background:rgba(200,0,0,0.4);">CLEAR</button>
    </div>

    <button onclick="showDeployModal()">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/v6.html', '_blank')">EDIT STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')">BANKING</button>

    <div style="margin-top:15px; font-size:11px; color:#aaa;">LIVE CHAT + VIDEO</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type message..." style="width:100%; padding:9px; background:rgba(0,0,0,0.5); border:1px solid var(--glass-border); border-radius:8px;">
    
    <div style="display:flex; gap:6px; margin-top:8px;">
      <button onclick="startVideoCall()" style="flex:1;">📹 START VIDEO</button>
      <button onclick="stopVideoCall()" style="flex:1; background:rgba(180,0,0,0.5);">⛔ STOP</button>
    </div>
    <button onclick="clearChat()" style="background:#333; font-size:11px;">CLEAR CHAT</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3 style="color:var(--electric-blue);">DEPLOY STORE</h3>
    <div id="kyc-notice" style="padding:12px; background:rgba(0,0,0,0.6); border-radius:10px; margin:12px 0;">
      KYC: <span id="kyc-status-text" style="color:#ff0;">CHECKING...</span>
    </div>

    <input type="text" id="name-input" placeholder="Store Name" style="width:100%; padding:10px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid var(--glass-border); color:#fff;">
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*" style="width:100%; margin:6px 0;">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html" style="width:100%; margin:6px 0;">

    <button onclick="deployStore()" id="deploy-btn">CONFIRM & DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

   
    <script>
  const DB_NAME = 'TiffyStoreDB';
  const STORE_NAME = 'StoreData';
  let meshDir = {};
  let myPeerId = null;
  const peer = new Peer(); 
  let activePeers = {};
  const myHandle = window.location.pathname.split('/').pop() || "MyStore";

  // --- DATABASE ---
  async function getDB() {
    return new Promise(r => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
      req.onsuccess = e => r(e.target.result);
    });
  }

  async function saveMeshToDB(data) {
    const db = await getDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(data, 'MESH_DIR');
    return new Promise(r => tx.oncomplete = r);
  }

  // --- KYC & DEPLOY ---
  async function deployStore() {
    if (!(!!localStorage.getItem("KYC_Verified_Hash") || !!localStorage.getItem("verified"))) {
      alert("Action Required: Complete KYC & Top Up"); 
      return;
    }
    const name = document.getElementById('name-input')?.value.trim() || myHandle;
    const fileInput = document.getElementById('html-input');
    if (!fileInput || !fileInput.files[0]) return;
    
    const html = await fileInput.files[0].text();
    meshDir[peer.id] = { id: peer.id, name, html, timestamp: Date.now() };
    await saveMeshToDB(meshDir);
    localStorage.setItem('ar_store_html', html);
    renderPortals();
    document.getElementById('upload-modal')?.classList.add('hidden');
  }

  // --- MESH & GOSSIP PROTOCOL ---
  function handleIncomingData(data) {
    if (data.type === 'PRESENCE') {
      activePeers[data.id] = data.name;
      let updated = false;
      Object.keys(data.dir).forEach(k => {
        if (!meshDir[k]) {
          meshDir[k] = data.dir[k];
          updated = true;
        }
      });
      if (updated) {
        saveMeshToDB(meshDir).then(renderPortals);
      }
      renderOnlineList();
    }
  }

  function initiateMeshSync() {
    Object.values(meshDir).forEach(store => {
      if (store.id !== myPeerId && !activePeers[store.id]) {
        const conn = peer.connect(store.id);
        conn.on('open', () => {
          activePeers[store.id] = store.name;
          renderOnlineList();
          conn.send({ type: 'PRESENCE', id: myPeerId, name: myHandle, dir: meshDir });
        });
        conn.on('data', handleIncomingData);
      }
    });
  }

  function broadcastPresence() {
    if (!myPeerId) return;
    const packet = { type: 'PRESENCE', id: myPeerId, name: myHandle, dir: meshDir };
    peer.connections && Object.values(peer.connections).forEach(conns => 
      conns.forEach(c => { if (c.open) c.send(packet); })
    );
  }

  // --- UI ---
  function renderPortals() {
    const container = document.getElementById('ar-portal');
    if (!container) return;
    container.innerHTML = '';
    Object.values(meshDir).forEach((biz, i) => {
      if (!biz.html) return;
      const el = document.createElement('a-plane');
      el.setAttribute('position', `${(i * 1.8) - 1.5} 0.6 -2.5`);
      el.setAttribute('material', { side: 'double', transparent: true });
      el.addEventListener('click', () => {
        const blob = new Blob([biz.html], {type: 'text/html'});
        window.open(URL.createObjectURL(blob), '_blank');
      });
      container.appendChild(el);
    });
  }

  function renderOnlineList() {
    const list = document.getElementById('online-members-list');
    if (!list) return;
    list.innerHTML = `<div class="suggestion-item"><span>${myHandle} (You)</span><span class="status-dot active"></span></div>`;
    Object.entries(activePeers).forEach(([id, name]) => {
      list.innerHTML += `<div class="suggestion-item"><span>${name}</span><span class="status-dot active"></span></div>`;
    });
  }

  // --- INIT ---
  peer.on('connection', (c) => {
    c.on('data', handleIncomingData);
    activePeers[c.peer] = 'Peer'; 
  });

  peer.on('open', (id) => {
    myPeerId = id;
    meshDir[id] = { id: id, name: myHandle };
    saveMeshToDB(meshDir);
    renderOnlineList();
    setInterval(broadcastPresence, 5000);
    setInterval(initiateMeshSync, 10000);
  });

  window.onload = async () => {
    const db = await getDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get('MESH_DIR');
    req.onsuccess = () => {
      meshDir = req.result || {};
      renderPortals();
    };
    
    const tiffyCounter = document.getElementById('tiffy-counter');
    if (tiffyCounter) tiffyCounter.textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
    
    const tusdCounter = document.getElementById('tusd-counter');
    if (tusdCounter) tusdCounter.textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
  };
</script>
</body>
</html>
