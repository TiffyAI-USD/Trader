<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #lens { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="lens"></iframe>
  <script>
    const lens = document.getElementById('lens');
    const KEY = 'webstore_pro_draft';

    function loadContent() {
      let data = localStorage.getItem(KEY);
      if (!data) return;

      // Forceful extraction: 
      // If it starts with {, we look for the first instance of <!DOCTYPE or <html>
      // and treat everything from that point onwards as the HTML.
      const htmlStartIndex = data.search(/<!DOCTYPE|<html/i);
      
      if (htmlStartIndex !== -1) {
          // Extract from the start of the HTML tag to the end of the string
          // We remove the trailing characters (like "}") if they exist
          data = data.substring(htmlStartIndex, data.lastIndexOf('>') + 1);
      }

      lens.srcdoc = data;
    }

    window.addEventListener('storage', (e) => {
      if (e.key === KEY) loadContent();
    });

    loadContent();
  </script>
</body>
</html>
