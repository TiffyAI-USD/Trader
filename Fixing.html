<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #lens { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="lens"></iframe>
  <script>
    const lens = document.getElementById('lens');
    const KEY = 'webstore_pro_draft';

    function loadContent() {
      const rawData = localStorage.getItem(KEY);
      if (!rawData) return;

      // If the data is a JSON string, we are going to treat it 
      // as a literal string to be injected.
      try {
        // If it's double-encoded, this will fix it.
        const cleanData = rawData.startsWith('"') ? JSON.parse(rawData) : rawData;
        lens.srcdoc = cleanData;
      } catch (e) {
        lens.srcdoc = rawData;
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === KEY) loadContent();
    });

    loadContent();
  </script>
</body>
</html>
