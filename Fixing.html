<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #lens { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="lens"></iframe>
  <script>
    const lens = document.getElementById('lens');
    const KEY = 'webstore_pro_draft';

    function loadContent() {
      let data = localStorage.getItem(KEY);
      if (!data) return;

      // Logic: If it's a JSON string, extract the HTML content.
      // If it's already raw HTML, render it as-is.
      if (data.trim().startsWith('{')) {
        try {
          const parsed = JSON.parse(data);
          // Adjust 'code' or 'html' to the actual key name in your JSON
          data = parsed.code || parsed.html || parsed.content || data;
        } catch (e) {
          // If JSON parsing fails, use the raw data
        }
      }

      lens.srcdoc = data;
    }

    window.addEventListener('storage', (e) => {
      if (e.key === KEY) loadContent();
    });

    loadContent();
  </script>
</body>
</html>
