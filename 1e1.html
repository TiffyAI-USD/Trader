<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { 
      --electric-blue: #007BFF; 
      --shocking-pink: #FF007F; 
      --glass: rgba(10, 12, 35, 0.65);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }

    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    #ui-panel { 
      position: fixed; top: 20px; right: 20px; 
      background: var(--glass); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(0, 240, 255, 0.4); 
      border-radius: 18px; 
      padding: 18px; 
      z-index: 100; 
      width: 340px; 
      max-height: 92vh; 
      overflow-y: auto; 
    }
    #ui-panel.hidden { transform: translateX(420px); }

    #toggle-ui { 
      position: fixed; top: 20px; left: 20px; z-index: 101; 
      background: var(--shocking-pink); border: none; 
      width: 48px; height: 48px; border-radius: 50%; 
      cursor: pointer; font-size: 22px; 
    }

    #projector-lens { width: 100%; height: 240px; background: #000; border: 1px solid #444; border-radius: 10px; margin: 12px 0; }

    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 8px 0; color: var(--shocking-pink); font-size: 1.1rem; }

    button { 
      background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); 
      border: none; color: #fff; padding: 12px; margin: 6px 0; 
      border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; 
    }

    #chat-container { 
      height: 130px; overflow-y: auto; background: rgba(0,0,0,0.6); 
      border: 1px solid rgba(0,240,255,0.3); padding: 10px; font-size: 12px; margin: 8px 0; 
    }

    #upload-modal { 
      position: fixed; top: 18%; left: 35%; width: 340px; 
      background: rgba(15,15,40,0.95); backdrop-filter: blur(15px); 
      border: 2px solid var(--electric-blue); 
      z-index: 300; color: #fff; border-radius: 16px; padding: 22px; 
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">UI</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" background="color: #000000">
      <a-assets>
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
      </a-assets>
      <a-sky src="#bg-video" rotation="0 -90 0" animation="property: rotation; from: 0 -90 0; to: 0 270 0; loop: true; dur: 90000; easing: linear"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:12px; font-size:1.3rem;">TIFFY MESH TERMINAL</div>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>

    <input type="text" id="search-bar" placeholder="Search Mesh..." style="width:100%; padding:9px; background:rgba(0,0,0,0.5); color:#fff; border:1px solid #444; border-radius:8px;">
    <button onclick="searchMesh()">SEARCH MATRIX</button>

    <iframe id="projector-lens" allowfullscreen="true"></iframe>

    <div style="display:flex; gap:6px;">
      <button onclick="loadHome()" style="background:#555;">HOME</button>
      <button onclick="clearViewer()" style="background:#c00;">CLEAR</button>
    </div>

    <button onclick="showDeployModal()">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/v6.html', '_blank')" style="background:#28a745;">EDIT STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')" style="background:#555;">BANKING</button>

    <div style="margin-top:12px; font-size:11px; color:#aaa;">LIVE CHAT + VIDEO</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type and Enter..." style="width:100%; padding:8px; background:#111; color:#fff; border:1px solid #666; border-radius:8px;">
    <button onclick="clearChat()" style="background:#444; font-size:10px;">CLEAR CHAT</button>
  </div>

  <!-- KYC + DEPLOY MODAL -->
  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <div id="kyc-notice" style="background:#220; padding:10px; border-radius:8px; margin:10px 0; font-size:14px;">
      KYC Status: <span id="kyc-status-text" style="color:#ff0;">NOT VERIFIED</span>
    </div>

    <a href="https://tiffyai-usd.github.io/Transact/Transfer-Cash.html" target="_blank" style="color:#0ff; display:block; margin:8px 0;">→ Top Up Terminal</a>
    <a href="#" onclick="verifyKYC(); return false;" style="color:#0f0; display:block; margin:8px 0;">→ Complete KYC Verification</a>

    <input type="text" id="name-input" placeholder="Store Name" style="width:100%; margin:8px 0; padding:8px; background:#000; color:#fff;">
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*" style="width:100%; margin:6px 0;">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html" style="width:100%; margin:6px 0;">

    <button id="deploy-btn" onclick="deployStore()">CONFIRM & DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

<script>
  const DB_NAME = 'TiffyStoreDB';
  const STORE_NAME = 'StoreData';
  let meshDir = {};
  const peer = new Peer();

  async function getDB() {
    return new Promise(resolve => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
      req.onsuccess = e => resolve(e.target.result);
    });
  }

  function verifyKYC() {
    localStorage.setItem("verified", "true");
    document.getElementById('kyc-status-text').innerHTML = "✅ VERIFIED";
    document.getElementById('kyc-status-text').style.color = "#0f0";
    alert("KYC Verified (demo mode)");
  }

  async function deployStore() {
    if (!localStorage.getItem("verified")) {
      alert("Please complete KYC verification first.");
      return;
    }

    const name = document.getElementById('name-input').value.trim() || "My Store";
    const hFile = document.getElementById('html-input').files[0];
    const tFile = document.getElementById('thumb-input').files[0];

    if (!hFile || !tFile) return alert("Please select both files");

    const btn = document.getElementById('deploy-btn');
    btn.disabled = true;
    btn.textContent = "Deploying...";

    try {
      const html = await hFile.text();
      const thumb = await new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result);
        fr.readAsDataURL(tFile);
      });

      const key = peer.id || 'local-' + Date.now();
      meshDir[key] = { id: key, name, html, thumb, timestamp: Date.now() };

      const db = await getDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(meshDir, 'MESH_DIR');

      localStorage.setItem('ar_store_html', html);

      renderPortals();
      document.getElementById('projector-lens').src = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
      document.getElementById('upload-modal').classList.add('hidden');
      alert("✅ Store deployed successfully!");
    } catch (e) {
      console.error(e);
      alert("Deploy failed. Check console.");
    } finally {
      btn.disabled = false;
      btn.textContent = "CONFIRM & DEPLOY";
    }
  }

  function renderPortals() {
    const container = document.getElementById('ar-portal');
    container.innerHTML = '';
    Object.values(meshDir).forEach((biz, i) => {
      const el = document.createElement('a-plane');
      el.setAttribute('position', `${(i * 1.6) - 1.2} 0.6 0`);
      el.setAttribute('width', '1.4');
      el.setAttribute('height', '1.4');
      el.setAttribute('material', {
        src: biz.thumb,
        side: 'double',
        transparent: true,
        shader: 'flat'
      });
      el.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
      el.addEventListener('click', () => {
        window.open(URL.createObjectURL(new Blob([biz.html], {type: 'text/html'})), '_blank');
      });
      container.appendChild(el);
    });
  }

  function searchMesh() {
    const query = document.getElementById('search-bar').value.toLowerCase();
    const found = Object.values(meshDir).find(b => b.name?.toLowerCase().includes(query));
    if (found) {
      document.getElementById('projector-lens').src = URL.createObjectURL(new Blob([found.html], {type: 'text/html'}));
    } else alert("Node not found.");
  }

  function showDeployModal() {
    document.getElementById('upload-modal').classList.remove('hidden');
  }

  function loadHome() { document.getElementById('projector-lens').src = 'https://tiffyai-usd.github.io/Web-Store-App/v6.html'; }
  function clearViewer() { document.getElementById('projector-lens').src = ''; }
  function clearChat() { 
    localStorage.removeItem('chat_hist'); 
    document.getElementById('chat-container').innerHTML = ''; 
  }

  window.onload = async () => {
    const db = await getDB();
    const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get('MESH_DIR');
    req.onsuccess = () => {
      meshDir = req.result || {};
      renderPortals();
    };

    document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
    document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;

    const savedHtml = localStorage.getItem('ar_store_html');
    if (savedHtml) document.getElementById('projector-lens').src = URL.createObjectURL(new Blob([savedHtml], {type: 'text/html'}));
    else loadHome();
  };
</script>
</body>
</html>
