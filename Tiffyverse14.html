<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    #ui-panel {
      position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.9);
      backdrop-filter: blur(12px); border: 1px solid var(--electric-blue);
      border-radius: 16px; padding: 16px; z-index: 100; width: 300px;
      max-height: 90vh; overflow-y: auto; transition: all 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(340px); }
    
    #toggle-ui { 
      position: fixed; top: 20px; right: 20px; z-index: 101; 
      background: var(--shocking-pink); color: #fff; border: none; 
      width: 40px; height: 40px; border-radius: 50%; 
      font-size: 20px; cursor: pointer; 
    }

    #projector-lens { width: 100%; height: 150px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 5px 0; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    
    #chat-container { height: 100px; overflow-y: auto; background: #111; border: 1px solid #444; padding: 5px; font-size: 11px; margin-top: 10px; border-radius: 8px; }
    #chat-input { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #666; border-radius: 8px; margin-top: 5px; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    
    <div style="font-size:10px; color:#aaa;">LIVE PREVIEW:</div>
    <iframe id="projector-lens"></iframe>
    
    <input type="file" id="prod-upload" style="display:none;">
    <button onclick="document.getElementById('prod-upload').click()">UPLOAD PRODUCT</button>
    <button id="upload-to-host" style="display:none; background:var(--electric-blue);">UPLOAD TO HOST</button>
    
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')">INTERNATIONAL BANK</button>

    <div style="margin-top:10px; font-size:10px; display:flex; justify-content:space-between; align-items:center;">
        <span>BROADCAST CHAT:</span>
        <button onclick="clearChat()" style="width:auto; padding:2px 8px; margin:0;">CLEAR</button>
    </div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type and press Enter...">
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const uploadBtn = document.getElementById('upload-to-host');
    const chatInput = document.getElementById('chat-input');
    const chatContainer = document.getElementById('chat-container');

    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');

    function clearChat() { localStorage.removeItem('terminal_chat_history'); chatContainer.innerHTML = ''; }

    window.onload = () => {
        if (localStorage.getItem("KYC_Verified_Hash")) uploadBtn.style.display = 'block';
        const liveSite = localStorage.getItem('sovereign_live_site');
        if (liveSite) projector.srcdoc = liveSite;
        chatContainer.innerHTML = localStorage.getItem('terminal_chat_history') || '';
    };

    document.getElementById('prod-upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => localStorage.setItem('pending_store_upload', ev.target.result);
        reader.readAsText(e.target.files[0]);
    };

    uploadBtn.onclick = () => {
        const data = localStorage.getItem('pending_store_upload');
        if(data) {
            localStorage.setItem('sovereign_live_site', data);
            projector.srcdoc = data;
            alert("Website broadcast to Host.");
        }
    };

    chatInput.onkeypress = (e) => {
        if (e.key === 'Enter' && chatInput.value) {
            const msg = `<div><b>You:</b> ${chatInput.value}</div>`;
            const hist = (localStorage.getItem('terminal_chat_history') || '') + msg;
            localStorage.setItem('terminal_chat_history', hist);
            chatContainer.innerHTML = hist;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            chatInput.value = '';
        }
    };
  </script>
</body>
</html>
