<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --glass: rgba(6, 10, 35, 0.55); --glass-border: rgba(0, 240, 255, 0.45); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }

    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px; z-index: 100; width: 340px; max-height: 92vh; overflow-y: auto; }
    
    /* Video Overlay */
    #video-chat-overlay { position: fixed; bottom: 20px; right: 20px; width: 300px; z-index: 500; background: #000; border: 2px solid var(--electric-blue); border-radius: 12px; overflow: hidden; display: none; }
    #remote-video { width: 100%; height: 200px; background: #111; object-fit: cover; }
    #local-video { position: absolute; bottom: 10px; right: 10px; width: 80px; height: 80px; border: 1px solid #fff; background: #000; }

    button { background: rgba(0, 240, 255, 0.18); border: 1px solid var(--glass-border); color: #fff; padding: 13px; margin: 6px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 12px 0; color: var(--electric-blue); font-size: 1.3rem; }
    #chat-container { height: 135px; overflow-y: scroll; background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); padding: 10px; font-size: 12.5px; margin: 10px 0; }
    #chat-input { width: 100%; padding: 9px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Video Element -->
  <div id="video-chat-overlay">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <button onclick="stopVideoCall()" style="background:rgba(255,0,0,0.5); margin:0;">HANG UP</button>
  </div>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-assets><video id="bg-video" autoplay loop muted playsinline src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video></a-assets>
      <a-sky src="#bg-video"></a-sky>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; color:var(--electric-blue);">TIFFY MESH TERMINAL</div>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Message or Peer ID to call...">
    <button onclick="initiateCall()">CALL PEER</button>
    <button onclick="clearChat()">CLEAR CHAT</button>
  </div>

<script>
  const peer = new Peer();
  let localStream = null;
  let currentCall = null;

  async function getLocalStream() {
    if (!localStream) {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('local-video').srcObject = localStream;
    }
    return localStream;
  }

  // Handle incoming calls
  peer.on('call', async (call) => {
    const stream = await getLocalStream();
    call.answer(stream);
    handleCall(call);
  });

  function handleCall(call) {
    currentCall = call;
    document.getElementById('video-chat-overlay').style.display = 'block';
    call.on('stream', (remoteStream) => {
      document.getElementById('remote-video').srcObject = remoteStream;
    });
  }

  async function initiateCall() {
    const peerId = document.getElementById('chat-input').value.trim();
    if (!peerId) return alert("Enter a Peer ID");
    const stream = await getLocalStream();
    const call = peer.call(peerId, stream);
    handleCall(call);
  }

  function stopVideoCall() {
    if (currentCall) currentCall.close();
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    document.getElementById('video-chat-overlay').style.display = 'none';
  }

  function clearChat() { document.getElementById('chat-container').innerHTML = ''; }
  
  peer.on('open', (id) => console.log('My ID:', id));
</script>
</body>
</html>
