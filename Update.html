<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DEBUG MESH</title>
  <!-- Loading ONLY essentials -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="background: #000; color: #fff;">

  <div id="debug-log" style="padding: 20px;">
    <h1>INITIALIZING...</h1>
    <div id="status">Loading Database...</div>
  </div>

  <script>
    const DB_NAME = 'TiffyStoreDB';
    const STORE_NAME = 'StoreData';

    async function init() {
      const log = document.getElementById('status');
      try {
        const request = indexedDB.open(DB_NAME, 1);
        
        request.onerror = () => log.innerText = "Error opening DB";
        request.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction(STORE_NAME, 'readonly');
          const getReq = tx.objectStore(STORE_NAME).get('MESH_DIR');
          
          getReq.onsuccess = () => {
            const data = getReq.result;
            const count = data ? Object.keys(data).length : 0;
            log.innerText = "SUCCESS! Found " + count + " shops in database.";
            console.log("Data found:", data);
          };
        };
      } catch (e) {
        log.innerText = "CRITICAL ERROR: " + e.message;
      }
    }
    init();
  </script>
</body>
</html>
