<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --glass: rgba(6, 10, 35, 0.55); --glass-border: rgba(0, 240, 255, 0.45); }
    /* ... (KEEP ALL YOUR ORIGINAL STYLES HERE) ... */
  </style>
</head>
<body>
  <!-- ... (KEEP ALL YOUR ORIGINAL HTML STRUCTURE HERE) ... -->

<script>
  // ... (KEEP ALL YOUR EXISTING CONSTANTS AND VARIABLES) ...
  const NITRO_KEY = 'TUSD_Nitro_Storage';

  // --- NEW: SIDECAR TRANSACTION ENGINE ---
  function processSidecarSale(sellerId, itemName, price) {
    let seller = meshDir[sellerId];
    if (!seller) return console.error("Seller not found");

    // 1. Update Nitro Balance
    let balance = parseFloat(localStorage.getItem(NITRO_KEY) || '0.00');
    let newBalance = balance + parseFloat(price);
    localStorage.setItem(NITRO_KEY, newBalance.toFixed(2));
    document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${newBalance.toFixed(2)}`;

    // 2. Log to Ledger
    if (!seller.transactions) seller.transactions = [];
    seller.transactions.push({ itemName, price, timestamp: Date.now() });
    saveMeshDir();

    // 3. Trigger Visual Receipt
    window.dispatchEvent(new CustomEvent('issue-receipt', { 
      detail: { businessName: seller.name, itemName, price } 
    }));
  }

  // --- NEW: RECEIPT OVERLAY ---
  window.addEventListener('issue-receipt', (e) => {
    const { businessName, itemName, price } = e.detail;
    const overlay = document.createElement('div');
    overlay.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999; padding:20px; background:rgba(0,0,0,0.95); border:2px solid var(--electric-blue); border-radius:10px; color:#fff; font-family:'Orbitron'; text-align:center; width:280px;";
    overlay.innerHTML = `
        <h3 style="color:var(--electric-blue);">TXN RECEIPT</h3>
        <p style="font-size:12px; opacity:0.7;">${businessName}</p>
        <p style="font-size:14px; margin:10px 0;">${itemName}</p>
        <h2 style="font-size:20px;">$${parseFloat(price).toFixed(2)}</h2>
    `;
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 5000);
  });

  // ... (KEEP ALL YOUR ORIGINAL FUNCTIONS: getDB, saveMeshDir, renderPortals, etc.) ...

  // UPDATE: Ensure your window.onload calls everything correctly
  window.onload = async () => {
    // ... (Your original onload logic) ...
    const db = await getDB();
    const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get('MESH_DIR');
    req.onsuccess = () => { 
      meshDir = req.result || {}; 
      renderPortals(); // This renders your 11 shops
      // ... (rest of your logic)
    };
    
    // Set initial counters
    document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
    document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
  };
</script>
</body>
</html>
