<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; transition: transform 0.3s; padding-bottom: 50px; }
    #ui-panel.hidden { transform: translateX(350px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    #projector-lens { width: 100%; height: 250px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 8px 0; color: var(--shocking-pink); }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 4px 0; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    #chat-container { height: 120px; overflow-y: auto; background: #000; border: 1px solid #444; padding: 8px; font-size: 11px; margin-bottom: 5px; }
    #upload-modal { position: fixed; top: 20%; left: 30%; width: 300px; background: #111; padding: 20px; border: 2px solid var(--electric-blue); z-index: 200; color: #fff; border-radius: 15px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>
    
    <div style="display:flex; gap:5px; margin-bottom:10px;">
        <input type="text" id="url-loader" placeholder="Enter URL..." style="flex:1; padding:5px; background:#111; color:#fff; border:1px solid #444; border-radius:4px;">
        <button onclick="testLoad()" style="width:auto; margin:0;">GO</button>
    </div>

    <iframe id="projector-lens"></iframe>

    <div style="display:flex; gap:5px;">
        <button onclick="loadHome()" style="background:#666;">HOME</button>
        <button onclick="clearViewer()" style="background:#c00;">CLEAR</button>
    </div>
    
    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')" style="background: #28a745;">EDIT/ADD TO STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')" style="background: #555;">INTERNATIONAL BANKING</button>
    
    <div style="margin-top:10px; font-size:10px; color:#aaa;">LIVE CHAT:</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type and Enter..." style="width:100%; padding:8px; background:#111; color:#fff; border:1px solid #666; border-radius:8px;">
    <button onclick="clearChat()" style="background:#444; font-size:10px; padding:5px;">CLEAR CHAT</button>
    <div style="height:50px;"></div> 
  </div>

  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*" style="width:100%;">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html" style="width:100%;">
    <button onclick="deployStore()">CONFIRM DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const arPortal = document.getElementById('ar-portal');
    const peer = new Peer('tiffy-trader-global-mesh');
    let connections = [];

    function deployStore() {
        if (!localStorage.getItem("KYC_Verified_Hash")) { alert("KYC Required!"); return; }
        const hFile = document.getElementById('html-input').files[0];
        const tFile = document.getElementById('thumb-input').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const htmlString = e.target.result;
            const blob = new Blob([htmlString], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            
            if (tFile) {
                const tReader = new FileReader();
                tReader.onload = (te) => {
                    localStorage.setItem('ar_store_html', htmlString);
                    localStorage.setItem('ar_store_thumb', te.target.result);
                    renderAR(url, te.target.result);
                };
                tReader.readAsDataURL(tFile);
            } else {
                localStorage.setItem('ar_store_html', htmlString);
                renderAR(url, null);
            }
            projector.src = url;
            document.getElementById('upload-modal').classList.add('hidden');
        };
        reader.readAsText(hFile);
    }

    // THE ONLY RENDERER: Using the exact method you said worked
    function renderAR(url, thumbData) {
        arPortal.innerHTML = '';
        const entity = document.createElement('a-plane');
        entity.setAttribute('position', '0 0 0');
        entity.setAttribute('width', '2'); 
        entity.setAttribute('height', '1.5');
        
        // This direct setAttribute call is what you confirmed works
        if (thumbData) entity.setAttribute('src', thumbData);
        else entity.setAttribute('color', '#FF007F');
        
        // Applying material side: double directly.
        entity.setAttribute('material', 'side', 'double');
        
        entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear');
        entity.addEventListener('click', () => window.open(url, '_blank'));
        arPortal.appendChild(entity);
    }

    // ... [PeerJS, Chat, and window.onload logic remain exactly the same as your working template] ...
    
    window.onload = () => {
        const sHtml = localStorage.getItem('ar_store_html');
        const sThumb = localStorage.getItem('ar_store_thumb');
        if (sHtml) {
            const blob = new Blob([sHtml], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            projector.src = url;
            renderAR(url, sThumb);
        }
    };
    
    // ... [Helper functions for buttons...]
    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');
  </script>
</body>
</html>
