<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  
  <!-- Matrix SDK -->
  <script src="https://cdn.jsdelivr.net/npm/matrix-js-sdk@34.0.0/browser-index.js"></script>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FF007F" />
  <link rel="icon" href="icon.png" type="image/png" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; touch-action: pan-y; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.9); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; max-width: 300px; box-shadow: 0 0 20px rgba(0, 123, 255, 0.4); transition: all 0.3s ease; }
    #ui-panel.hidden { transform: translateX(320px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    #tiffy-counter, #tusd-counter { font-family: 'Orbitron', sans-serif; font-size: 20px; color: var(--shocking-pink); text-shadow: 0 0 10px var(--shocking-pink); text-align: center; margin-bottom: 8px; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px 16px; margin: 6px 0; border-radius: 12px; width: 100%; font-weight: 500; cursor: pointer; transition: 0.3s; font-size: 14px; }
    button:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--electric-blue); }
    button:active { transform: scale(0.98); }
    #share-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
    #share-box { background: #111; padding: 20px; border-radius: 16px; border: 1px solid var(--shocking-pink); text-align: center; max-width: 90%; }
    #ref-link { background: #222; padding: 12px; border-radius: 8px; margin: 12px 0; word-break: break-all; font-family: monospace; color: var(--electric-blue); }
    #voice-status { font-size: 12px; color: #aaa; margin-top: 8px; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 999; flex-direction: column; color: var(--shocking-pink); }
    #loader.hidden { display: none; }
    .glow-text { text-shadow: 0 0 10px var(--shocking-pink), 0 0 20px var(--shocking-pink); }
  </style>
</head>
<body>

  <div id="loader">
    <h2>TIFFYAI • Sovereign Portal</h2>
    <p>Hold tight, honey. Bank sync in progress.</p>
    <div style="margin-top:20px; width:200px; height:4px; background:#333; border-radius:2px; overflow:hidden;">
      <div style="width:99%; height:100%; background:var(--shocking-pink); animation: pulse 1.5s infinite;"></div>
    </div>
  </div>

  <div id="scene-container">
    <a-scene embedded background="color: #000" renderer="antialias: true" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-camera position="0 1.6 0" wasd-controls-enabled="false"><a-cursor></a-cursor></a-camera>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  <div id="ui-panel">
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    <div id="tusd-counter">TUSD Nitro: 0.00</div>
    <button id="refresh-balances">Sync Bank Ledger</button>
    <button id="share-button">Share & Earn</button>
    <button id="start-trading">Start 2 Trades</button>
    <button id="claim-rewards">Claim Rewards</button>
    <hr style="margin:10px 0; border:0; border-top:1px solid #444;">
    <h4 style="font-size:10px; color:#666; margin-bottom:5px;">MARKETPLACE & CHAT</h4>
    <input type="file" id="prod-upload" style="display:none;">
    <button onclick="document.getElementById('prod-upload').click()">UPLOAD PRODUCT</button>
    <button id="chat-btn">MATRIX CHAT</button>
    <div id="voice-status">Voice: Ready</div>
    <div id="debug-log" style="font-size:10px; color:#666; margin-top:10px; max-height:60px; overflow-y:auto;"></div>
  </div>

  <script>
    // BANK SYNC
    function syncBank() {
      const t = parseFloat(localStorage.getItem('Tiffy_Harvest_Pending') || '0');
      const n = parseFloat(localStorage.getItem('TUSD_Nitro_Storage') || '0');
      document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${t.toFixed(2)}`;
      document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${n.toFixed(2)}`;
      log('Ledger Updated');
    }
    
    function log(msg) {
        const d = document.getElementById('debug-log');
        d.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        d.scrollTop = d.scrollHeight;
    }

    // MATRIX INITIALIZATION
    const matrixClient = matrixcs.createClient({ baseUrl: "https://matrix.org" });
    document.getElementById('chat-btn').onclick = () => {
        log('Connecting to Matrix...');
        // Placeholder for authentication flow
    };

    // PRODUCT UPLOAD
    document.getElementById('prod-upload').onchange = (e) => {
        const file = e.target.files[0];
        if(file) log('Staging: ' + file.name);
    };

    // UI CONTROLS
    document.getElementById('refresh-balances').onclick = syncBank;
    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');
    
    window.onload = () => {
      setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1000);
      syncBank();
    };
  </script>
</body>
</html>
