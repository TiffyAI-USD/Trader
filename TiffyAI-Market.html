<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <meta name="description" content="Your private TIFFYAI trading portal. Share, earn, trade. Fingerprint-gated." />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FF007F" />
  <link rel="icon" href="icon.png" type="image/png" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --electric-blue: #007BFF;
      --shocking-pink: #FF007F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      touch-action: pan-y;
    }
    #scene-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* Floating UI Panel - Electric Blue & Pink Theme */
    #ui-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(10, 10, 30, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--electric-blue);
      border-radius: 16px;
      padding: 16px;
      z-index: 100;
      max-width: 300px;
      box-shadow: 0 0 20px rgba(0, 123, 255, 0.4);
      transition: all 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(320px); }
    #toggle-ui { 
      position: fixed; top: 20px; right: 20px; z-index: 101; 
      background: var(--shocking-pink); color: #000; border: none; 
      width: 40px; height: 40px; border-radius: 50%; 
      font-size: 20px; cursor: pointer; 
    }

    /* Counter */
    #tiffy-counter {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      color: var(--shocking-pink);
      text-shadow: 0 0 10px var(--shocking-pink);
      text-align: center;
      margin-bottom: 12px;
    }

    /* Buttons */
    button {
      background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink));
      border: none;
      color: #fff;
      padding: 12px 16px;
      margin: 6px 0;
      border-radius: 12px;
      width: 100%;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }
    button:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--electric-blue); }
    button:active { transform: scale(0.98); }

    /* Share Modal */
    #share-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center;
      z-index: 200;
    }
    #share-box {
      background: #111;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--shocking-pink);
      text-align: center;
      max-width: 90%;
    }
    #ref-link {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      word-break: break-all;
      font-family: monospace;
      color: var(--electric-blue);
    }

    /* Voice Status */
    #voice-status {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
    }

    /* Loading */
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: flex; justify-content: center; align-items: center;
      z-index: 999; flex-direction: column; color: var(--shocking-pink);
    }
    #loader.hidden { display: none; }

    /* 3D Text Glow */
    .glow-text { text-shadow: 0 0 10px var(--shocking-pink), 0 0 20px var(--shocking-pink); }

    /* Floating Particles */
    .particle {
      width: 4px; height: 4px; background: var(--shocking-pink); border-radius: 50%;
      position: absolute; opacity: 0.8; pointer-events: none;
      animation: float 6s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <h2>TIFFYAI • Sovereign Portal...</h2>
    <p>Hold tight. Local sync in progress.</p>
    <div style="margin-top:20px; width:200px; height:4px; background:#333; border-radius:2px; overflow:hidden;">
      <div style="width:99%; height:100%; background:var(--shocking-pink); animation: pulse 1.5s infinite;"></div>
    </div>
  </div>

  <!-- A-Frame 3D Scene -->
  <div id="scene-container">
    <a-scene 
      embedded 
      background="color: #000" 
      renderer="antialias: true" 
      vr-mode-ui="enabled: false"
      shadow="type: pcfsoft"
      fog="type: linear; color: #000; near: 10; far: 50"
      cursor="rayOrigin: mouse"
    >
      <a-assets timeout="10000">
        <img id="sky" src="sky.jpg" crossorigin="anonymous" />
        <audio id="click-sound" src="click.mp3" preload="auto"></audio>
        <audio id="reward-sound" src="reward.mp3" preload="auto"></audio>
        <audio id="voice-welcome" src="welcome.mp3" preload="auto"></audio>
        <img id="grid" src="grid.png" crossorigin="anonymous" />
      </a-assets>

      <a-sky src="#sky" rotation="0 -90 0" animation="property: rotation; to: 0 -450 0; loop: true; dur: 120000; easing: linear"></a-sky>

      <!-- Floating TIFFY Orb -->
      <a-entity position="0 2 -4">
        <a-sphere 
          radius="0.8" 
          color="var(--electric-blue)" 
          emissive="var(--shocking-pink)" 
          emissive-intensity="0.8"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        >
          <a-text value="TIFFY" position="0 0 0.9" align="center" color="#000" width="3" class="glow-text"></a-text>
        </a-sphere>
      </a-entity>

      <!-- Ground Grid -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="30" height="30" color="#111" material="src: #grid; repeat: 15 15;"></a-plane>

      <a-camera position="0 1.6 0" wasd-controls-enabled="false">
        <a-cursor color="var(--shocking-pink)" fuse="true" fuseTimeout="1500"></a-cursor>
      </a-camera>

      <!-- Interactive Buttons -->
      <a-entity position="0 1.2 -2.5" class="clickable" onclick="startTrading()">
        <a-box depth="0.1" height="0.6" width="2" color="var(--shocking-pink)">
          <a-text value="START 2 TRADES" align="center" color="#fff" position="0 0 0.06" width="3"></a-text>
        </a-box>
      </a-entity>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  <div id="ui-panel">
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    <button id="connect-wallet">Connect Wallet</button>
    <button id="refresh-balances">Refresh Balances</button>
    <button id="start-trading">Start 2 Trades</button>
    <div id="voice-status">Voice: Initializing...</div>
    <div id="debug-log" style="font-size:10px; color:#666; margin-top:10px; max-height:60px; overflow-y:auto;"></div>
  </div>

  <script>
    // === CONFIGURATION ===
    const REPO_BASE = 'https://tiffyai.github.io/Bucks';
    
    // === STATE ===
    const userId = localStorage.getItem('userId') || 'user_' + Date.now();
    if (!localStorage.getItem('userId')) localStorage.setItem('userId', userId);
    
    // Local Sovereign Keys
    let tiffyBalance = parseFloat(localStorage.getItem('Tiffy_AI') || '0');
    let nitroBalance = parseFloat(localStorage.getItem('TUSD_Nitro_Storage') || '0');

    // === INIT ===
    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 2000);
    updateCounter();
    log('System initialized: Sovereign Mode');

    // === LOCAL TRADING ENGINE ===
    function startTrading() {
      // Manual trading logic (Oracle Standby)
      log('Trading Engine: Standby (Oracle Awaiting Data)');
      alert('Sovereign Mode: Trading engine active locally. Awaiting price feed.');
    }

    function updateCounter() {
      tiffyBalance = parseFloat(localStorage.getItem('Tiffy_AI') || '0');
      document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${tiffyBalance.toFixed(2)}`;
    }

    function log(msg) {
      const d = document.getElementById('debug-log');
      d.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    }

    document.getElementById('refresh-balances').onclick = updateCounter;

    // === SERVICE WORKER ===
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/Bucks/sw.js')
          .then(() => log('SW registered'))
          .catch(err => log('SW failed: ' + err));
      });
    }
  </script>
</body>
</html>
