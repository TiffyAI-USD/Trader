<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Marketplace</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.9); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; max-width: 300px; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 5px 0; border-radius: 8px; width: 100%; cursor: pointer; font-family: 'Orbitron'; }
    #marketplace-grid { padding: 20px; display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-top: 350px; }
    .store-card { background: #111; padding: 15px; border-radius: 15px; border: 1px solid #444; }
  </style>
</head>
<body>

  <!-- Marketplace UI Panel -->
  <div id="ui-panel">
    <div id="tiffy-counter" style="color:var(--shocking-pink); font-family:Orbitron;">TIFFYAI: 0.00</div>
    <div id="tusd-counter" style="color:var(--shocking-pink); font-family:Orbitron;">TUSD Nitro: 0.00</div>
    <button id="refresh-balances">Sync Bank Ledger</button>
    <button id="share-button">Share & Earn</button>
    <button id="start-trading">Start 2 Trades</button>
    <button id="claim-rewards">Claim Rewards</button>
    
    <hr style="border-top:1px solid #444; margin:10px 0;">
    
    <label style="font-size:10px; color:var(--shocking-pink);">LIVE STATUS FEED</label>
    <input type="text" id="ownerStatus" placeholder="Owner Flash Update..." style="width:100%; background:#000; color:var(--shocking-pink); border:1px solid var(--shocking-pink); margin-bottom:5px; padding:5px;">
    <input type="text" id="clientStatus" placeholder="Client Inquiry..." style="width:100%; background:#000; color:var(--electric-blue); border:1px solid var(--electric-blue); padding:5px;">
    
    <hr style="border-top:1px solid #444; margin:10px 0;">
    
    <input type="file" id="prod-upload" style="display:none;">
    <button onclick="document.getElementById('prod-upload').click()">UPLOAD WEBSITE</button>
    <button onclick="publishStore()" style="background:var(--shocking-pink);">PUBLISH STORE</button>
  </div>

  <div id="marketplace-grid"></div>

<script>
    // --- Hosting & Publishing Engine ---
    function publishStore() {
        const storeName = localStorage.getItem("Current_Tiffy_Store") || "Sugarloaf";
        const htmlContent = localStorage.getItem('pending_store_upload');
        if (!htmlContent) { alert('No file uploaded to publish!'); return; }
        localStorage.setItem(storeName + "_Webpage", htmlContent);
        alert(storeName + ' published successfully.');
    }

    function hostStoreWebsite(storeName) {
        const rawHTML = localStorage.getItem(storeName + "_Webpage");
        if (!rawHTML) { alert("No website published for this store."); return; }
        const hostWindow = window.open('', '_blank');
        hostWindow.document.write(rawHTML);
        hostWindow.document.close();
    }

    // --- Status/Chat Logic ---
    function updateStatus(field) {
        const store = localStorage.getItem("Current_Tiffy_Store") || "Sugarloaf";
        localStorage.setItem(store + "_" + field, document.getElementById(field).value);
    }

    function loadStatus() {
        const store = localStorage.getItem("Current_Tiffy_Store") || "Sugarloaf";
        document.getElementById('ownerStatus').value = localStorage.getItem(store + "_ownerStatus") || "";
        document.getElementById('clientStatus').value = localStorage.getItem(store + "_clientStatus") || "";
        renderMarketplace();
    }

    function renderMarketplace() {
        const stores = JSON.parse(localStorage.getItem("Tiffy_All_Stores") || '["Sugarloaf"]');
        const grid = document.getElementById('marketplace-grid');
        grid.innerHTML = stores.map(store => `
            <div class="store-card">
                <h3 style="color:var(--electric-blue);">${store}</h3>
                <p style="font-size:0.8rem; color:#888;">Live Feed: ${localStorage.getItem(store + "_ownerStatus") || "..."}</p>
                <button onclick="hostStoreWebsite('${store}')">VISIT STORE</button>
            </div>
        `).join('');
    }

    // --- Initialization ---
    document.getElementById('ownerStatus').oninput = () => updateStatus('ownerStatus');
    document.getElementById('clientStatus').oninput = () => updateStatus('clientStatus');
    
    document.getElementById('prod-upload').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (event) => localStorage.setItem('pending_store_upload', event.target.result);
      reader.readAsText(e.target.files[0]);
    };

    window.addEventListener('storage', loadStatus);
    document.addEventListener('DOMContentLoaded', loadStatus);
</script>
</body>
</html>
