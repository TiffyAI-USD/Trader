<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Tiffyverse Marketplace</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.9); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; max-width: 300px; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px; margin: 5px 0; border-radius: 12px; width: 100%; cursor: pointer; font-family: 'Orbitron'; font-size: 14px; }
    input { width: 100%; background: #000; color: white; border: 1px solid var(--electric-blue); padding: 8px; margin-top: 5px; }
  </style>
</head>
<body>

  <a-scene embedded background="color: #000" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
    <a-sky src="sky.jpg"></a-sky>
    <!-- Trading/Staking Hub -->
    <a-entity position="0 1.2 -2.5" class="clickable" onclick="startTrading()">
      <a-box depth="0.1" height="0.6" width="2" color="var(--shocking-pink)"></a-box>
      <a-text value="TRADE/STAKE" align="center" position="0 0.5 0"></a-text>
    </a-entity>
    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>

  <div id="ui-panel">
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    <button id="start-trading">Start Trading</button>
    <button id="claim-rewards">Claim Rewards</button>
    
    <hr style="margin:10px 0; border:0; border-top:1px solid #444;">
    
    <label style="font-size:10px;">LIVE STATUS FEED</label>
    <input type="text" id="ownerStatus" placeholder="Owner Flash Status..." oninput="updateStatus('ownerStatus')">
    <input type="text" id="clientStatus" placeholder="Client Inquiry..." oninput="updateStatus('clientStatus')">
    
    <hr style="margin:10px 0; border:0; border-top:1px solid #444;">
    
    <input type="file" id="prod-upload" style="display:none;">
    <button onclick="document.getElementById('prod-upload').click()">UPLOAD WEBSITE</button>
    <button onclick="publishStore()" style="background:var(--shocking-pink);">PUBLISH STORE</button>
    <button onclick="visitStore()">VISIT WEBSITE</button>
  </div>

  <script>
    // Logic keys matching the Owner Dashboard
    const getStore = () => localStorage.getItem("Current_Tiffy_Store") || "Sugarloaf";

    function publishStore() {
        const store = getStore();
        const content = localStorage.getItem('pending_store_upload');
        if (!content) { alert('No file uploaded!'); return; }
        localStorage.setItem(store + "_Webpage", content);
        alert('Published to: ' + store);
    }

    function visitStore() {
        const store = getStore();
        const html = localStorage.getItem(store + "_Webpage");
        if (!html) { alert("No website found for " + store); return; }
        const w = window.open();
        w.document.write(html);
        w.document.close();
    }

    function updateStatus(field) {
        const store = getStore();
        localStorage.setItem(store + "_" + field, document.getElementById(field).value);
    }

    document.getElementById('prod-upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => localStorage.setItem('pending_store_upload', ev.target.result);
        reader.readAsText(e.target.files[0]);
    };

    // Load initial state
    document.addEventListener('DOMContentLoaded', () => {
        const store = getStore();
        document.getElementById('ownerStatus').value = localStorage.getItem(store + "_ownerStatus") || "";
        document.getElementById('clientStatus').value = localStorage.getItem(store + "_clientStatus") || "";
    });
  </script>
</body>
</html>
