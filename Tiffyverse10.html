<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { margin: 0; background: #000; color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; }
    
    #ui-panel {
      position: fixed; top: 20px; right: 20px; width: 320px; height: 95vh;
      background: rgba(0, 0, 0, 0.95); border: 1px solid var(--electric-blue);
      padding: 16px; z-index: 100; overflow-y: auto; border-radius: 16px;
      transition: transform 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(350px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; }
    
    /* SANDBOXED LENS: Isolate storefront logic */
    #projector-lens { 
        width: 100%; height: 300px; background: #000; 
        border: 1px solid #444; border-radius: 8px; margin: 10px 0; 
    }
    
    button { background: linear-gradient(45deg, #111, #333); border: 1px solid var(--electric-blue); color: #fff; padding: 12px; margin: 4px 0; border-radius: 8px; width: 100%; cursor: pointer; }
    #chat-container { height: 160px; overflow-y: auto; background: #000; border: 1px solid #444; padding: 8px; font-size: 11px; margin-bottom: 5px; }
    #chat-input { width: 100%; padding: 12px; background: #111; color: #fff; border: 1px solid #666; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <a-scene embedded background="color: #000" vr-mode-ui="enabled: false" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;">
    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    <div id="tiffy-counter" style="text-align:center; color:var(--shocking-pink);">TIFFYAI: 0.00</div>
    
    <iframe id="projector-lens" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
    
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')">EDIT/ADD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')" style="border-color:var(--electric-blue);">INTERNATIONAL BANK</button>
    <button id="upload-to-host" style="display:none; color:var(--shocking-pink); font-weight:bold;">BROADCAST TO LEDGER</button>

    <div style="font-size:10px; color:#aaa; margin-top:10px;">LIVE CHAT:</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type and enter to broadcast...">
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const uploadBtn = document.getElementById('upload-to-host');

    // Use a function that creates a fresh iframe if the previous one crashes
    function renderPreview(html) {
        // Force refresh the iframe container to kill any stuck JS processes
        projector.srcdoc = ""; 
        setTimeout(() => {
            projector.srcdoc = html;
        }, 50);
    }

    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');

    uploadBtn.onclick = () => {
        const data = localStorage.getItem('webstore_pro_draft');
        if(data) {
            localStorage.setItem('sovereign_live_site', data);
            renderPreview(data);
            alert("Broadcast Successful.");
        }
    };

    // Chat functionality remains the same
    document.getElementById('chat-input').onkeypress = (e) => {
        if (e.key === 'Enter' && e.target.value) {
            const hist = (localStorage.getItem('terminal_chat_history') || '') + `<div><b>You:</b> ${e.target.value}</div>`;
            localStorage.setItem('terminal_chat_history', hist);
            document.getElementById('chat-container').innerHTML = hist;
            e.target.value = '';
        }
    };

    window.onload = () => {
        if (localStorage.getItem("KYC_Verified_Hash")) uploadBtn.style.display = 'block';
        const savedSite = localStorage.getItem('sovereign_live_site');
        if (savedSite) renderPreview(savedSite);
        document.getElementById('chat-container').innerHTML = localStorage.getItem('terminal_chat_history') || '';
    };
  </script>
</body>
</html>
