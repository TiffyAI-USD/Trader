<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; }
    #projector-lens { width: 100%; height: 350px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px; margin: 5px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false"><a-camera position="0 1.6 0"></a-camera></a-scene>
  </div>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:15px;">TIFFYAI TERMINAL</div>
    <div style="font-size:10px; color:#aaa;">LIVE STORE PREVIEW:</div>
    <iframe id="projector-lens"></iframe>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')">EDIT/ADD TO STORE</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    
    // LOCKED TO THE CORRECT KEY
    window.onload = () => {
        const liveData = localStorage.getItem('webstore_pro_draft');
        if (liveData) {
            projector.srcdoc = liveData;
        }
    };
  </script>
</body>
</html>
