<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --shocking-pink: #ff00aa; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    #ui-panel { 
      position: fixed; top: 15px; right: 15px; 
      background: rgba(8, 12, 35, 0.45); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(0, 240, 255, 0.5); 
      border-radius: 16px; 
      padding: 14px; 
      z-index: 100; 
      width: 320px; 
      max-height: 90vh; 
      overflow-y: auto; 
    }

    button { 
      background: rgba(0, 240, 255, 0.25); 
      border: 1px solid rgba(0, 240, 255, 0.6); 
      color: #fff; 
      padding: 11px; 
      margin: 5px 0; 
      border-radius: 10px; 
      width: 100%; 
      cursor: pointer; 
      font-weight: bold; 
    }

    #toggle-ui { 
      position: fixed; top: 15px; left: 15px; z-index: 200; 
      background: rgba(255,0,170,0.7); 
      border: none; 
      width: 42px; 
      height: 42px; 
      border-radius: 50%; 
      cursor: pointer; 
      font-size: 20px; 
    }

    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 6px 0; color: #ff88cc; font-size: 1.05rem; }
    #chat-container { height: 150px; overflow-y: auto; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,240,255,0.3); padding: 8px; font-size: 11px; margin: 8px 0; }
    video { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(0,240,255,0.4); border-radius: 8px; margin: 5px 0; }
    .hidden { display: none !important; }
    #status { margin: 8px 0; padding: 8px; background: rgba(0,0,0,0.6); border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" background="color: #000000">
      <a-assets>
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
      </a-assets>
      <a-sky src="#bg-video" rotation="0 -90 0"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px; font-size:1.25rem; color:#00f0ff;">TIFFY MESH TERMINAL</div>
    
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>

    <input type="text" id="search-bar" placeholder="Search (shoes, food...)" style="width:100%; padding:9px; background:rgba(0,0,0,0.4); color:#fff; border:1px solid rgba(0,240,255,0.4); border-radius:8px; margin:8px 0;">
    <button onclick="searchMesh()">SEARCH MESH</button>

    <iframe id="projector-lens" allow="fullscreen" allowfullscreen="true" style="height:210px; border:1px solid rgba(0,240,255,0.4);"></iframe>

    <div style="display:flex; gap:5px;">
        <button onclick="loadHome()" style="background:rgba(80,80,80,0.6);">HOME</button>
        <button onclick="clearViewer()" style="background:rgba(200,0,0,0.6);">CLEAR</button>
    </div>

    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')" style="background: rgba(40,170,70,0.7);">EDIT STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')" style="background: rgba(80,80,80,0.7);">BANKING</button>

    <div style="margin-top:12px; font-size:10px; color:#aaa;">LIVE CHAT + VIDEO</div>
    <div id="chat-container"></div>
    <video id="local-video" autoplay muted playsinline></video>
    <video id="remote-video" autoplay playsinline></video>

    <input type="text" id="chat-input" placeholder="Type message..." style="width:100%; padding:9px; background:rgba(0,0,0,0.4); color:#fff; border:1px solid rgba(0,240,255,0.4); border-radius:8px; margin-top:8px;">
    <button onclick="startVideoCall()" style="background:rgba(255,0,102,0.7);">📹 START VIDEO</button>
    <button onclick="stopVideoCall()" style="background:rgba(140,0,0,0.7);">⛔ STOP VIDEO</button>
    <button onclick="clearChat()" style="background:rgba(70,70,70,0.7); font-size:10px;">CLEAR CHAT</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <div id="status">Ready to deploy</div>
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*" style="width:100%; margin:8px 0;">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html" style="width:100%; margin:8px 0;">
    <button onclick="deployStore()" style="margin-top:12px; padding:14px;">CONFIRM & DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

<script>
// ==================== IndexedDB Setup ====================
const DB_NAME = 'TiffyStoreDB';
const STORE_NAME = 'stores';

let dbPromise = indexedDB.open(DB_NAME, 1);
dbPromise.onupgradeneeded = e => {
  const db = e.target.result;
  if (!db.objectStoreNames.contains(STORE_NAME)) {
    db.createObjectStore(STORE_NAME, { keyPath: "id" });
  }
};

async function saveToIDB(data) {
  const db = await new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onsuccess = () => res(req.result);
    req.onerror = rej;
  });
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(data);
    tx.oncomplete = () => res(true);
    tx.onerror = rej;
  });
}

async function loadFromIDB() {
  const db = await new Promise((res) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onsuccess = () => res(req.result);
  });
  return new Promise((res) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => res(req.result);
  });
}

// ==================== Core Variables ====================
const projector = document.getElementById('projector-lens');
const arPortal = document.getElementById('ar-portal');
let meshDir = {};

async function deployStore() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = "Reading files...";

  const hFile = document.getElementById('html-input').files[0];
  const tFile = document.getElementById('thumb-input').files[0];

  if (!hFile || !tFile) {
    alert("Please select both files");
    statusEl.textContent = "Ready to deploy";
    return;
  }

  try {
    const html = await hFile.text();
    const thumb = await new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.readAsDataURL(tFile);
    });

    const id = 'store_' + Date.now();
    const storeData = {
      id: id,
      name: "My Store",
      html: html,
      thumb: thumb,
      timestamp: Date.now()
    };

    meshDir[id] = storeData;
    await saveToIDB(storeData);

    localStorage.setItem('ar_store_html', html);

    statusEl.textContent = "✅ Deploy Successful!";
    setTimeout(() => {
      renderPortals();
      projector.src = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
      document.getElementById('upload-modal').classList.add('hidden');
      statusEl.textContent = "Ready to deploy";
    }, 600);

  } catch (err) {
    console.error(err);
    alert("Deploy failed. Check console (F12).");
    statusEl.textContent = "Error occurred";
  }
}

function renderPortals() {
  arPortal.innerHTML = '';
  Object.values(meshDir).forEach((biz, i) => {
    const el = document.createElement('a-plane');
    el.setAttribute('position', `${(i * 2) - 2} 0.6 -2.5`);
    el.setAttribute('width', '1.6');
    el.setAttribute('height', '1.6');
    el.setAttribute('material', {
      src: biz.thumb,
      side: 'double',
      transparent: true,
      shader: 'flat',
      color: '#ffffff'
    });
    el.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear');

    el.addEventListener('click', () => {
      const blob = new Blob([biz.html], {type: 'text/html'});
      window.open(URL.createObjectURL(blob), '_blank');
    });

    arPortal.appendChild(el);
  });
}

function searchMesh() {
  const query = document.getElementById('search-bar').value.toLowerCase().trim();
  if (!query) return;
  const found = Object.values(meshDir).find(b => b.name.toLowerCase().includes(query));
  if (found) {
    projector.src = URL.createObjectURL(new Blob([found.html], {type: 'text/html'}));
  } else {
    alert("No store found.");
  }
}

// Video & Chat functions (kept from your version)
let localStream = null;
async function startVideoCall() { /* ... same as before */ }
function stopVideoCall() { /* ... same as before */ }
function addChatMessage(msg) { /* ... same as before */ }
function loadHome() { projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html'; }
function clearViewer() { projector.src = ''; }
function clearChat() { document.getElementById('chat-container').innerHTML = ''; }

window.onload = async () => {
  const savedStores = await loadFromIDB();
  savedStores.forEach(store => meshDir[store.id] = store);
  renderPortals();

  // Load counters and saved html
  document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
  document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;

  const savedHtml = localStorage.getItem('ar_store_html');
  if (savedHtml) projector.src = URL.createObjectURL(new Blob([savedHtml], {type: 'text/html'}));
  else loadHome();
};
</script>
</body>
</html>
