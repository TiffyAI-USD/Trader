<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Debug</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10,10,30,0.95); border: 1px solid #007BFF; border-radius: 12px; padding: 15px; width: 340px; max-height: 90vh; overflow-y: auto; z-index: 100; }
    button { padding: 12px; margin: 6px 0; width: 100%; background: linear-gradient(#007BFF, #FF007F); color: white; border: none; border-radius: 8px; font-weight: bold; }
    #chat-container { height: 200px; overflow-y: auto; background: #111; padding: 8px; margin: 10px 0; }
  </style>
</head>
<body>

<div id="ui-panel">
  <h2 style="text-align:center; color:#FF007F;">TIFFY MESH TERMINAL (DEBUG)</h2>
  
  <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
  <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')">BANKING</button>

  <div style="margin:15px 0 5px; color:#aaa;">Chat / Status:</div>
  <div id="chat-container"></div>
</div>

<!-- UPLOAD MODAL -->
<div id="upload-modal" style="display:none; position:fixed; top:20%; left:30%; background:#111; padding:20px; border:2px solid #007BFF; border-radius:12px; z-index:200; width:320px;">
  <h3>Deploy Store</h3>
  <input type="file" id="thumb-input" accept="image/*"><br><br>
  <input type="file" id="html-input" accept=".html"><br><br>
  <button onclick="deployStore()" style="background:#28a745; padding:14px;">CONFIRM & DEPLOY</button>
  <button onclick="document.getElementById('upload-modal').style.display='none'">Cancel</button>
</div>

<script>
function addChatMessage(msg) {
  const div = document.createElement('div');
  div.textContent = "> " + msg;
  document.getElementById('chat-container').appendChild(div);
  div.scrollIntoView();
}

async function deployStore() {
  addChatMessage("Deploy button clicked...");

  const htmlFile = document.getElementById('html-input').files[0];
  const thumbFile = document.getElementById('thumb-input').files[0];

  if (!htmlFile || !thumbFile) {
    addChatMessage("ERROR: Please select both files");
    return;
  }

  addChatMessage("Reading files...");

  const htmlReader = new FileReader();
  htmlReader.onload = function(e) {
    addChatMessage("HTML file loaded successfully");
    addChatMessage("Store deployed to local mesh (test mode)");
    
    // Save to localStorage for testing
    localStorage.setItem('ar_store_html', e.target.result);
    document.getElementById('upload-modal').style.display = 'none';
  };
  htmlReader.readAsText(htmlFile);
}

addChatMessage("Terminal ready. Try uploading a store.");
</script>
</body>
</html>
