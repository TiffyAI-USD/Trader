<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Directory Flow App</title>
    <style>
        body {
            font-family: monospace;
            background: #121212;
            color: #00ff66;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-size: 1.2rem;
        }
        .log-box {
            background: #000;
            border: 1px solid #333;
            padding: 12px;
            height: 220px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .log-entry {
            margin-bottom: 6px;
        }
        .log-info { color: #00ccff; }
        .log-success { color: #00ff66; }
        .log-error { color: #ff3333; }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background: #00ff66;
            color: #121212;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }
        button:hover {
            background: #00cc52;
        }
        button:disabled {
            background: #444;
            color: #777;
            cursor: not-allowed;
        }
        .preview-pane {
            margin-top: 15px;
            background: #181818;
            border: 1px dashed #444;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mesh Directory Flow Visualizer</h2>
        <div id="logBox" class="log-box">
            <div class="log-entry log-info">[Init] Initializing 4-section flow environment...</div>
        </div>
        
        <div class="btn-container">
            <button id="downloadBtn" disabled>Download Next User's App File</button>
        </div>

        <div id="previewPane" class="preview-pane">
            Current Local Storage Ledger Preview: Not loaded yet.
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            div.className = `log-entry log-${type}`;
            div.textContent = `> ${message}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        (function() {
            const MESH_KEY = 'mesh_directory_ledger';
            const LOCAL_KEY = 'app_local_user_data';

            // 1. CACHE MEMORY (Initialized from the app's hardcoded memory state)
            let cacheMemory = {
                version: "1.0.0",
                nodes: [
                    {
                        nodeId: "genesis_node",
                        storeData: { id: "genesis_node", name: "Original Seed Store", items: [] },
                        timestamp: 1718000000000
                    }
                ]
            };

            try {
                log("Section 1: Reading browser local storage...", "info");
                const existingMeshJSON = localStorage.getItem(MESH_KEY);
                if (existingMeshJSON) {
                    const parsedMesh = JSON.parse(existingMeshJSON);
                    if (parsedMesh && Array.isArray(parsedMesh.nodes) && parsedMesh.nodes.length >= cacheMemory.nodes.length) {
                        cacheMemory = parsedMesh;
                        log(`Found existing mesh ledger in local storage with ${cacheMemory.nodes.length} nodes.`, "success");
                    } else {
                        log("Local storage ledger found, but cache memory configuration takes precedence or matches.", "info");
                    }
                } else {
                    log("No prior mesh ledger found in local storage. Using genesis seed.", "info");
                }

                // Find current user's local store data
                const rawUserStore = localStorage.getItem(LOCAL_KEY);
                let currentUserStore = rawUserStore ? JSON.parse(rawUserStore) : {
                    id: "user_store_" + Math.random().toString(36).substring(2, 7),
                    name: "Local User Shop",
                    created: Date.now()
                };
                log(`Loaded local user store ID: ${currentUserStore.id}`, "success");

                // 2. CACHE MEMORY INTEGRATION: Take local info, update cache memory with the full network breakdown
                log("Section 2: Cache memory integration running...", "info");
                if (!Array.isArray(cacheMemory.nodes)) {
                    cacheMemory.nodes = [];
                }

                const existingIndex = cacheMemory.nodes.findIndex(n => n.nodeId === currentUserStore.id);
                const entry = {
                    nodeId: currentUserStore.id,
                    storeData: currentUserStore,
                    timestamp: Date.now()
                };

                if (existingIndex > -1) {
                    cacheMemory.nodes[existingIndex] = entry;
                    log(`Updated existing node entry in cache memory for ID: ${currentUserStore.id}`, "success");
                } else {
                    cacheMemory.nodes.push(entry);
                    log(`Appended new node entry into cache memory. Total nodes now: ${cacheMemory.nodes.length}`, "success");
                }

                // 3. LOCAL STORAGE WRITE: Save everything back down into local storage so local storage carries on normally
                log("Section 3: Rewriting synchronized state back to local storage...", "info");
                localStorage.setItem(MESH_KEY, JSON.stringify(cacheMemory));
                localStorage.setItem(LOCAL_KEY, JSON.stringify(currentUserStore));
                log("Local storage successfully updated and synchronized.", "success");

                // Update UI preview box
                document.getElementById('previewPane').textContent = JSON.stringify(cacheMemory, null, 2);

                // 4. CACHE MEMORY STANDBY / HANDOVER: Bake updated cache memory into the next file instance
                log("Section 4: Preparing standby cache memory for the next user...", "info");
                const nextUserAppContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mesh Directory Flow App</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff66; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; }
        h2 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .log-box { background: #000; border: 1px solid #333; padding: 12px; height: 180px; overflow-y: auto; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mesh Directory Flow App (Next User Node)</h2>
        <div id="logBox" class="log-box">
            <div>> [Init] Next user app instance booted successfully.</div>
        </div>
    </div>
    <script>
        (function() {
            const MESH_KEY = 'mesh_directory_ledger';
            const LOCAL_KEY = 'app_local_user_data';
            const inheritedCacheMemory = ${JSON.stringify(cacheMemory)};

            try {
                localStorage.setItem(MESH_KEY, JSON.stringify(inheritedCacheMemory));
                const box = document.getElementById('logBox');
                const div = document.createElement('div');
                div.style.color = '#00ff66';
                div.textContent = "> [Success] Inherited mesh loaded into local storage. Total nodes: " + inheritedCacheMemory.nodes.length;
                box.appendChild(div);
            } catch (e) {
                console.error("Failed to write inherited mesh", e);
            }
        })();
    <\/script>
</body>
</html>`;

                const blob = new Blob([nextUserAppContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);

                const btn = document.getElementById('downloadBtn');
                btn.disabled = false;
                btn.onclick = function() {
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = 'mesh_app_next_user.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    log("Next user app file downloaded successfully.", "success");
                };

                log("Flow complete! All 4 sections executed successfully. Ready for export.", "success");

            } catch (err) {
                log(`Flow Error: ${err.message}`, "error");
            }
        })();
    </script>

</body>
</html>
