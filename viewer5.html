<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel {
      position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95);
      backdrop-filter: blur(12px); border: 1px solid var(--electric-blue);
      border-radius: 16px; padding: 16px; z-index: 100; width: 320px;
      max-height: 95vh; overflow-y: auto; transition: all 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(350px); }
    #toggle-ui { 
      position: fixed; top: 20px; right: 20px; z-index: 101; 
      background: var(--shocking-pink); color: #fff; border: none; 
      width: 40px; height: 40px; border-radius: 50%; 
      font-size: 20px; cursor: pointer; 
    }
    #projector-lens { 
      width: calc(100% + 2px); height: 350px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0;
      display: block; 
    }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 10px 0; color: var(--shocking-pink); }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px; margin: 5px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
      <a-sphere position="0 2 -4" radius="0.8" color="var(--electric-blue)" opacity="0.5"></a-sphere>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:15px; border-bottom:1px solid #444;">TIFFYAI TERMINAL</div>
    
    <div style="font-size:10px; color:#aaa;">LIVE STORE PREVIEW:</div>
    <iframe id="projector-lens"></iframe>
    
    <button onclick="repairPreview()" style="background: #dc3545;">REPAIR PREVIEW</button>
    
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')">EDIT/ADD TO STORE</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');

    function repairPreview() {
        // This resets the key that currently holds "Bridge Restored"
        const freshLayout = `
            <div style="background:#000; color:#fff; padding:20px; font-family:sans-serif;">
                <h1 style="color:#007BFF;">Preview Restored</h1>
                <p>The system is now ready for your design.</p>
            </div>
        `;
        localStorage.setItem('sovereign_live_site', freshLayout);
        projector.srcdoc = freshLayout;
        alert("Preview repaired and synchronized.");
    }

    window.onload = () => {
        projector.srcdoc = localStorage.getItem('sovereign_live_site') || '<h1>No Data Found</h1>';
    };
  </script>
</body>
</html>
