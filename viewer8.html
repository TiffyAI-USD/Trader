<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webstore Pro - Sovereign Local Edition</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Bebas Neue', sans-serif; }
        .banner { 
            position: absolute; 
            top: 0; 
            width: 100%; 
            height: auto; 
            background: linear-gradient(90deg, #d4af37, #fdfbfb); 
            z-index: 10;
        }
        .product-img { width: 100%; display: block; }
        #order-btn {
            background-color: #25d366;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="banner" id="banner-container"></div>
    <div id="product-display"></div>
    <div id="order-btn" onclick="sendWhatsApp()">Order via WhatsApp</div>

    <a-scene embedded style="height: 500px; width: 100%;">
        <a-entity id="model-container"></a-entity>
        <a-camera position="0 1.6 3"></a-camera>
    </a-scene>

    <script>
        const tiffyai_activated = true;
        const banner = document.getElementById('banner-container');
        const modelContainer = document.getElementById('model-container');

        function loadSovereignData() {
            const data = JSON.parse(localStorage.getItem('webstore_pro_data'));
            if (!data) return;

            // Load Banner
            if (data.banner_url) {
                banner.innerHTML = `<img src="${data.banner_url}" class="product-img">`;
            }

            // Load Model
            if (data.model_url) {
                const model = document.createElement('a-entity');
                model.setAttribute('gltf-model', data.model_url);
                model.setAttribute('position', data.position || "0 0 0");
                model.setAttribute('scale', data.scale || "1 1 1");
                modelContainer.appendChild(model);
            }
        }

        function sendWhatsApp() {
            const data = JSON.parse(localStorage.getItem('webstore_pro_data'));
            window.location.href = `https://wa.me/${data.phone}?text=I want to order: ${data.item_name}`;
        }

        window.onload = loadSovereignData;
    </script>
</body>
</html>
