<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    #ui-panel {
      position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95);
      backdrop-filter: blur(12px); border: 1px solid var(--electric-blue);
      border-radius: 16px; padding: 16px; z-index: 100; width: 320px;
      max-height: 95vh; overflow-y: auto; transition: all 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(350px); }
    
    #toggle-ui { 
      position: fixed; top: 20px; right: 20px; z-index: 101; 
      background: var(--shocking-pink); color: #fff; border: none; 
      width: 40px; height: 40px; border-radius: 50%; 
      font-size: 20px; cursor: pointer; 
    }

    /* Enlarged Preview Window */
    #projector-lens { width: 100%; height: 350px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 10px 0; color: var(--shocking-pink); }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px; margin: 5px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
      <!-- AR Elements restored -->
      <a-sphere position="0 2 -4" radius="0.8" color="var(--electric-blue)" opacity="0.5"></a-sphere>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:15px; border-bottom:1px solid #444;">TIFFYAI TERMINAL</div>
    
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>
    
    <div style="font-size:10px; color:#aaa;">LIVE STORE PREVIEW:</div>
    <iframe id="projector-lens"></iframe>
    
    <!-- Link replaced as requested -->
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')" style="background: #28a745;">EDIT/ADD TO STORE</button>
    
    <button id="upload-to-host" style="display:none;">UPLOAD TO HOST</button>
    
    <div id="debug-log" style="font-size:9px; color:#666; margin-top:10px;"></div>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const uploadBtn = document.getElementById('upload-to-host');

    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');

    function updateStats() {
        const t = localStorage.getItem('Tiffy_Harvest_Pending') || '0.00';
        const n = localStorage.getItem('TUSD_Nitro_Storage') || '0.00';
        document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${t}`;
        document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${n}`;
    }

    window.onload = () => {
        updateStats();
        if (localStorage.getItem("KYC_Verified_Hash")) uploadBtn.style.display = 'block';
        
        // Load live store
        const liveSite = localStorage.getItem('sovereign_live_site');
        if (liveSite) projector.srcdoc = liveSite;
    };

    uploadBtn.onclick = () => {
        const data = localStorage.getItem('webstore_pro_draft'); // Syncing from Builder draft
        if(data) {
            localStorage.setItem('sovereign_live_site', data);
            projector.srcdoc = data;
            alert("Broadcast Success: Storefront Updated.");
        }
    };
  </script>
</body>
</html>
