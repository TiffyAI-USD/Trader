<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #ui-panel { position: absolute; top: 20px; right: 20px; z-index: 100; background: rgba(0,0,0,0.8); padding: 20px; width: 300px; border-radius: 10px; }
    #projector-lens { width: 100%; height: 200px; background: #222; border: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

<a-scene embedded vr-mode-ui="enabled: false">
    <a-camera position="0 1.6 0"></a-camera>
    <a-entity id="ar-anchor" position="0 1.5 -3"></a-entity>
</a-scene>

<div id="ui-panel">
    <iframe id="projector-lens"></iframe>
    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
</div>

<div id="upload-modal" class="hidden" style="position:fixed; top:20%; left:20%; background:#333; padding:20px; z-index:999;">
    <input type="file" id="thumb-input" accept="image/*">
    <input type="file" id="html-input" accept=".html">
    <button onclick="deployStore()">DEPLOY</button>
</div>

<script>
    const projector = document.getElementById('projector-lens');
    const arAnchor = document.getElementById('ar-anchor');
    const peer = new Peer('tiffy-trader-global-mesh');

    // 1. Core Deployment Logic (Using Blobs for reliability)
    function deployStore() {
        if (!localStorage.getItem("KYC_Verified_Hash")) { alert("KYC Required!"); return; }
        
        const htmlFile = document.getElementById('html-input').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const htmlContent = e.target.result;
            // Create Blob URL for reliable loading
            const blob = new Blob([htmlContent], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            
            // Sync UI
            projector.src = url;
            renderAR(url);
            
            // Broadcast
            connections.forEach(c => c.send({ type: 'STORE', url: url }));
            document.getElementById('upload-modal').classList.add('hidden');
        };
        reader.readAsText(htmlFile);
    }

    // 2. AR Rendering
    function renderAR(url) {
        arAnchor.innerHTML = ''; // Clear old
        const box = document.createElement('a-box');
        box.setAttribute('color', '#FF007F');
        box.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000');
        box.addEventListener('click', () => { window.open(url, '_blank'); });
        arAnchor.appendChild(box);
    }

    // 3. P2P Mesh
    let connections = [];
    peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (d) => { if(d.type === 'STORE') { projector.src = d.url; renderAR(d.url); } });
    });
</script>
</body>
</html>
