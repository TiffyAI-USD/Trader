<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; --gold: #d4a373; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; transition: all 0.3s ease; }
    #ui-panel.hidden { transform: translateX(350px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    #projector-lens { width: 100%; height: 300px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 8px 0; color: var(--shocking-pink); }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 4px 0; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    .nav-btn { display: flex; gap: 5px; }
    #chat-container { height: 140px; overflow-y: auto; background: #000; border: 1px solid #444; padding: 8px; font-size: 11px; margin-bottom: 5px; }
    #chat-input { width: 100%; padding: 12px; background: #111; color: #fff; border: 1px solid #666; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false"><a-camera position="0 1.6 0"></a-camera></a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>
    
    <div style="display:flex; gap:5px; margin-bottom:10px;">
        <input type="text" id="url-loader" placeholder="Enter URL..." style="flex:1; padding:5px; background:#111; color:#fff; border:1px solid #444; border-radius:4px;">
        <button onclick="testLoad()" style="width:auto; margin:0;">GO</button>
    </div>
    
    <iframe id="projector-lens"></iframe>

    <button onclick="document.getElementById('prod-upload').click()">IMPORT LOCAL HTML</button>
    <input type="file" id="prod-upload" style="display:none;">
    <button id="upload-to-host" style="display:none; background:var(--gold); color:#000;">UPLOAD TO HOST</button>
    
    <div class="nav-btn">
        <button onclick="clearViewer()" style="background:#c00;">CLEAR</button>
    </div>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')" style="background: #28a745;">EDIT/ADD TO STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Banking-App/InternationalBank.html', '_blank')" style="background: #555;">INTERNATIONAL BANKING</button>
    
    <div style="margin-top:10px; font-size:10px; color:#aaa;">LIVE CHAT:</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type and Enter...">
  </div>

  <script>
    const lens = document.getElementById('projector-lens');
    const uploader = document.getElementById('prod-upload');
    const STORAGE_KEY = 'webstore_pro_draft';

    // The rendering logic that handles your JSON data
    function updateProjector(data) {
        if (data.includes('"menu":')) {
            // It's the JSON structure, route it to the store builder template
            lens.src = 'https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html';
            lens.onload = () => {
                lens.contentWindow.postMessage({ type: 'LOAD_DATA', payload: data }, '*');
            };
        } else {
            // It's raw HTML, inject directly
            lens.srcdoc = data;
        }
    }

    // Initial load
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        updateProjector(saved);
    }

    // File import
    uploader.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const content = event.target.result;
            localStorage.setItem(STORAGE_KEY, content);
            updateProjector(content);
        };
        reader.readAsText(file);
    });

    // External URL load
    function testLoad() { 
        lens.src = document.getElementById('url-loader').value; 
    }

    function clearViewer() { 
        localStorage.removeItem(STORAGE_KEY);
        lens.src = "about:blank";
        lens.srcdoc = "";
    }

    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');

    window.onload = () => {
        document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
        document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
        
        if (localStorage.getItem("KYC_Verified_Hash")) {
            document.getElementById('upload-to-host').style.display = 'block';
        }
    };
  </script>
</body>
</html>
