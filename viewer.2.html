<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; }
    .hidden { display: none; }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    #projector-lens { width: 100%; height: 350px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px; margin: 5px 0; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; }
    #chat-container { height: 80px; overflow-y: auto; background: #111; border: 1px solid #444; padding: 5px; font-size: 11px; margin-top:10px; }
    #chat-input { width: 100%; background: #222; color: #fff; border: 1px solid #666; padding: 8px; margin-top:5px; }
  </style>
</head>
<body>
  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </div>
  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">></button>
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:15px; border-bottom:1px solid #444;">TIFFYAI TERMINAL</div>
    
    <div style="font-size:10px; color:#aaa;">HTML UPLOAD:</div>
    <input type="file" id="file-uploader" accept=".html" style="width:100%; margin:5px 0; background:#222; color:#fff;">
    
    <div style="font-size:10px; color:#aaa;">LIVE STORE PREVIEW:</div>
    <iframe id="projector-lens"></iframe>
    
    <div style="margin-top:10px; font-size:10px; display:flex; justify-content:space-between;">
        <span>BROADCAST CHAT:</span>
        <button onclick="clearChat()" style="width:auto; padding:2px 5px; margin:0;">CLEAR</button>
    </div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type to broadcast...">
  </div>
  <script>
    const projector = document.getElementById('projector-lens');
    const uploader = document.getElementById('file-uploader');
    const chatInput = document.getElementById('chat-input');
    const chatContainer = document.getElementById('chat-container');

    function clearChat() { localStorage.removeItem('terminal_chat_history'); chatContainer.innerHTML = ''; }

    uploader.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            projector.srcdoc = e.target.result;
        };
        reader.readAsText(file);
    });

    chatInput.onkeypress = (e) => {
        if (e.key === 'Enter' && chatInput.value) {
            const msg = `<div><b>You:</b> ${chatInput.value}</div>`;
            const hist = (localStorage.getItem('terminal_chat_history') || '') + msg;
            localStorage.setItem('terminal_chat_history', hist);
            chatContainer.innerHTML = hist;
            chatInput.value = '';
        }
    };

    window.onload = () => {
        chatContainer.innerHTML = localStorage.getItem('terminal_chat_history') || '';
    };
  </script>
</body>
</html>
