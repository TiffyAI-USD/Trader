<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>
<body>
    <a-scene embedded vr-mode-ui="enabled: false">
        <a-assets>
            <video id="bgvideo" autoplay loop muted playsinline></video>
        </a-assets>
        <a-sky id="background" src="#bgvideo"></a-sky>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        // The exact swap logic that prevents the white-out
        function swapBackground(url) {
            const video = document.getElementById("bgvideo");
            if (!video) return;
            
            video.src = url;
            video.load(); 
            video.play().catch(err => console.log("Waiting for user interaction..."));
            
            document.querySelector("#background").setAttribute("src", "#bgvideo");
        }

        // Trigger with your specific file
        window.onload = () => {
            swapBackground("Terminal1.mp4");
        };

        // Final interaction unlock
        document.body.addEventListener('click', () => {
            const v = document.getElementById("bgvideo");
            if (v.paused) v.play();
        }, { once: true });
    </script>
</body>
</html>
