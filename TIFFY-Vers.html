<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sovereign Mesh Terminal | Active</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>
<body>

  <a-scene embedded vr-mode-ui="enabled: false">
    <a-assets>
      <!-- The source element -->
      <video id="terminal-vid" loop="true" muted playsinline crossorigin="anonymous"></video>
    </a-assets>

    <!-- The sky primitive bound to the asset -->
    <a-sky id="background" src="#terminal-vid" rotation="0 0 0"></a-sky>
    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>

  <script>
    // The exact swapBackground method used in TiffyAI Interface
    function swapBackground(url) {
      const vid = document.getElementById('terminal-vid');
      const sky = document.getElementById('background');

      vid.src = url;
      vid.load(); // Forces the browser to re-bind the new mp4
      vid.play();
      
      // Re-bind to sky to ensure it takes the texture
      sky.setAttribute('src', '#terminal-vid');
      console.log("Terminal initialized with:", url);
    }

    // Execution: Triggering with your new file
    window.addEventListener('load', () => {
      swapBackground('Terminal1.mp4');
    });

    // Interaction lock override
    window.addEventListener('click', () => {
      document.getElementById('terminal-vid').play();
    }, { once: true });
  </script>
</body>
</html>
