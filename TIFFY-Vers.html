<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>
<body>
    <a-scene embedded vr-mode-ui="enabled: false">
        <a-assets>
            <!-- THIS is the ID binding that the a-sky is looking for -->
            <video id="bgvideo" autoplay loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>
        
        <!-- Binding to the ID -->
        <a-sky id="background" src="#bgvideo"></a-sky>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        // Your exact swap function logic
        function swapBackground(url) {
            const video = document.getElementById("bgvideo");
            if (!video) return;
            
            // 1. Force the source update
            video.src = url;
            // 2. Clear the buffer and force a reload
            video.load(); 
            // 3. Kick off the playback
            video.play().catch(err => console.log("Waiting for user interaction..."));
            
            // A-Frame's internal loader is already watching #bgvideo, 
            // so we don't need to change the sky attribute if the ID stays the same.
        }

        // Trigger loading the specific file
        window.onload = () => {
            swapBackground("Terminal1.mp4");
        };
    </script>
</body>
</html>
