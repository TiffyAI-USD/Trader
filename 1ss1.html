<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --glass: rgba(8, 12, 35, 0.5); --glass-border: rgba(0, 240, 255, 0.5); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }

    #ui-panel { 
      position: fixed; top: 15px; right: 15px; 
      background: var(--glass); backdrop-filter: blur(22px); 
      border: 1px solid var(--glass-border); border-radius: 18px; 
      padding: 15px; z-index: 100; width: 320px; 
    }

    button { 
      background: rgba(0, 240, 255, 0.2); border: 1px solid var(--glass-border); 
      color: #fff; padding: 11px; margin: 5px 0; border-radius: 10px; 
      width: 100%; cursor: pointer; font-weight: bold; 
    }

    #toggle-ui { 
      position: fixed; top: 15px; left: 15px; z-index: 200; 
      background: #ff00aa; border: none; width: 45px; height: 45px; 
      border-radius: 50%; cursor: pointer; font-size: 22px; 
    }

    #search-bar { width:100%; padding:10px; background:rgba(0,0,0,0.5); color:#fff; border:1px solid var(--glass-border); border-radius:10px; }
    
    #search-suggestions {
      position: absolute; width: 290px; background: rgba(6, 10, 35, 0.95); 
      backdrop-filter: blur(15px); border: 1px solid var(--electric-blue);
      border-radius: 0 0 12px 12px; z-index: 300; max-height: 260px;
      overflow-y: auto; box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3);
      display: none;
    }
    .suggestion-item { 
      padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(0,240,255,0.2);
    }
    .suggestion-item:hover { background: rgba(0, 240, 255, 0.25); color: var(--electric-blue); }

    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 8px 0; color: #ff88cc; }
    #projector-lens { width: 100%; height: 210px; background: #000; border: 1px solid var(--glass-border); border-radius: 10px; margin: 10px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" background="color: #000000">
      <a-assets>
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
      </a-assets>
      <a-sky src="#bg-video" rotation="0 -90 0" animation="property: rotation; from: 0 -90 0; to: 0 270 0; loop: true; dur: 90000; easing: linear"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px; color:#00f0ff;">TIFFY MESH TERMINAL</div>
    
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>

    <input type="text" id="search-bar" placeholder="Search stores...">
    <div id="search-suggestions"></div>

    <iframe id="projector-lens" allow="fullscreen" allowfullscreen="true"></iframe>

    <button onclick="loadHome()">HOME</button>
    <button onclick="clearViewer()">CLEAR</button>
    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/v6.html', '_blank')">EDIT STORE</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*" style="width:100%;">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html" style="width:100%;">
    <button onclick="deployStore()">CONFIRM & DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

<script>
// ==================== INDEXEDDB ====================
const DB_NAME = 'TiffyStoreDB';
const STORE_NAME = 'StoreData';

async function getFromIDB(key) {
    const db = await new Promise(r => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = e => r(e.target.result);
    });
    return new Promise(r => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => r(req.result);
    });
}

async function saveToIDB(key, value) {
    const db = await new Promise(r => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onsuccess = e => r(e.target.result);
    });
    return new Promise(r => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(value, key);
        tx.oncomplete = () => r(true);
    });
}

let meshDir = {};
const projector = document.getElementById('projector-lens');
const searchBar = document.getElementById('search-bar');
const suggestionsBox = document.getElementById('search-suggestions');

async function deployStore() {
    const isVerified = localStorage.getItem("verified") || localStorage.getItem("KYC_Verified_Hash");
    if (!isVerified) {
        alert("Please complete KYC registration first.");
        window.open('https://tiffyai-usd.github.io/KYC/', '_blank');
        return;
    }

    const hFile = document.getElementById('html-input').files[0];
    const tFile = document.getElementById('thumb-input').files[0];
    if (!hFile || !tFile) return alert("Please select both files");

    const html = await hFile.text();
    const thumb = await new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result);
        fr.readAsDataURL(tFile);
    });

    const name = "My Store"; // You can connect this to your draft later

    const storeData = { id: 'store_' + Date.now(), name, html, thumb, timestamp: Date.now() };
    meshDir = storeData;
    await saveToIDB('MESH_DIR', meshDir);

    renderPortals();
    document.getElementById('upload-modal').classList.add('hidden');
    alert("Store deployed successfully!");
}

function renderPortals() {
    // Your AR planes code here
    console.log("Rendering", Object.keys(meshDir).length, "stores");
}

function showSuggestions(matches) {
    if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
    }

    suggestionsBox.innerHTML = '';
    matches.forEach(store => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.textContent = store.name;
        div.onclick = () => {
            searchBar.value = store.name;
            suggestionsBox.style.display = 'none';
            openStore(store);
        };
        suggestionsBox.appendChild(div);
    });
    suggestionsBox.style.display = 'block';
}

function openStore(store) {
    const blob = new Blob( , {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
}

function searchMesh() {
    const query = searchBar.value.toLowerCase().trim();
    if (!query) {
        suggestionsBox.style.display = 'none';
        return;
    }

    const matches = Object.values(meshDir).filter(store => 
        store.name.toLowerCase().includes(query)
    );
    showSuggestions(matches);
}

searchBar.addEventListener('input', searchMesh);

function loadHome() { 
    projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/v6.html'; 
}
function clearViewer() { projector.src = ''; }

window.onload = async () => {
    const saved = await getFromIDB('MESH_DIR');
    if (saved) meshDir = saved;
    renderPortals();
};
</script>
</body>
</html>
