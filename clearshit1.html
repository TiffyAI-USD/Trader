<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    #ui-panel {
      position: fixed; top: 20px; right: 20px; width: 300px; max-height: 90vh;
      background: rgba(10, 10, 30, 0.9); backdrop-filter: blur(12px);
      border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px;
      z-index: 100; overflow-y: auto;
    }
    
    #projector-lens { width: 100%; height: 150px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 5px 0; border-radius: 10px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    <div id="projector-lens"></div>
    
    <input type="file" id="prod-upload" style="display:none;">
    <button onclick="document.getElementById('prod-upload').click()">UPLOAD PRODUCT</button>
    
    <button id="upload-to-host" style="background:var(--electric-blue);">UPLOAD TO HOST</button>
  </div>

  <script>
    // CLEANED: Removed all KYC, sovereign memory, and terminal logic.
    // This now relies on your original intended flow.
    
    document.getElementById('prod-upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            // This is your original entry point for data
            localStorage.setItem('raw_project_data', ev.target.result);
        };
        reader.readAsText(e.target.files[0]);
    };

    document.getElementById('upload-to-host').onclick = () => {
        // Your original button logic is restored.
        // It no longer checks for KYC or sovereign keys.
        alert("Upload sequence initiated.");
    };
  </script>
</body>
</html>
