<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIFFY MESH_DIR Server & State Bridge</title>
  <style>
    :root {
      --electric-blue: #00f0ff;
      --glass: rgba(6, 10, 35, 0.75);
      --glass-border: rgba(0, 240, 255, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', monospace, sans-serif;
      background: #000;
      color: #fff;
      padding: 25px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
    }
    h2 {
      color: var(--electric-blue);
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }
    .section {
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }
    h3 {
      font-size: 1rem;
      color: #ff00aa;
      margin-bottom: 10px;
    }
    button, label.file-btn {
      background: rgba(0, 240, 255, 0.2);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      display: block;
      text-align: center;
      margin-top: 8px;
      transition: all 0.2s ease;
    }
    button:hover, label.file-btn:hover {
      background: rgba(0, 240, 255, 0.4);
      transform: scale(1.02);
    }
    input[type="file"] {
      display: none;
    }
    textarea {
      width: 100%;
      height: 130px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--glass-border);
      color: var(--electric-blue);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #00ff00;
      text-align: center;
    }
    .flex-row {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>TIFFY MESH_DIR FILE BRIDGE</h2>
    
    <div class="section">
      <h3>1. EXPORT STATE (Browser 1)</h3>
      <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Downloads your complete database state file directly to your machine.</p>
      <button onclick="exportMeshFile()">DOWNLOAD MESH STATE (.JSON)</button>
    </div>

    <div class="section">
      <h3>2. IMPORT & INJECT STATE (Browser 2)</h3>
      <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Select the downloaded JSON file. It will automatically load and commit into IndexedDB.</p>
      <label class="file-btn">
        SELECT & UPLOAD MESH FILE
        <input type="file" id="import-file" accept=".json" onchange="importMeshFile(event)">
      </label>
      <div id="write-status" class="status"></div>
    </div>

    <div class="section">
      <h3>3. LIVE INSPECTOR</h3>
      <textarea id="state-output" placeholder="State inspection view..."></textarea>
      <div class="flex-row" style="margin-top: 10px;">
        <button onclick="loadServerState()">REFRESH VIEW</button>
        <button onclick="window.location.reload()" style="background: rgba(255,0,170,0.2);">RELOAD APP</button>
      </div>
    </div>
  </div>

<script>
  const DB_NAME = 'TiffyStoreDB';
  const STORE_NAME = 'StoreData';

  async function getDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }

  async function loadServerState() {
    try {
      const db = await getDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get('MESH_DIR');
      req.onsuccess = () => {
        const data = req.result || {};
        document.getElementById('state-output').value = JSON.stringify(data, null, 2);
      };
    } catch (err) {
      console.error(err);
    }
  }

  async function exportMeshFile() {
    try {
      const db = await getDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get('MESH_DIR');
      req.onsuccess = async () => {
        const data = req.result || {};
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MESH_DIR_SYNC_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };
    } catch (err) {
      alert("Failed to export database state.");
    }
  }

  async function importMeshFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        
        const db = await getDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(importedData, 'MESH_DIR');
        
        tx.oncomplete = () => {
          document.getElementById('write-status').textContent = "✅ File successfully imported and committed to IndexedDB!";
          loadServerState();
        };
        tx.onerror = () => {
          document.getElementById('write-status').textContent = "❌ Database commit failed.";
        };
      } catch (err) {
        alert("Invalid JSON file structure.");
        console.error(err);
      }
    };
    reader.readAsText(file);
  }

  window.onload = loadServerState;
</script>

</body>
</html>
