<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    #ui-panel {
      position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95);
      backdrop-filter: blur(12px); border: 1px solid var(--electric-blue);
      border-radius: 16px; padding: 16px; z-index: 100; width: 320px;
      max-height: 95vh; overflow-y: auto; transition: all 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(350px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

    #projector-lens { width: 100%; height: 350px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 5px 0; color: var(--shocking-pink); }
    button { background: #222; border: 1px solid var(--electric-blue); color: #fff; padding: 10px; margin: 4px 0; border-radius: 8px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
      <a-sphere position="0 2 -4" radius="0.8" color="var(--electric-blue)" opacity="0.3"></a-sphere>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>
    
    <iframe id="projector-lens"></iframe>
    
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')">EDIT/ADD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')" style="background:var(--electric-blue);">INTERNATIONAL BANK</button>
    <button id="upload-to-host" style="display:none; color:var(--shocking-pink);">BROADCAST TO LEDGER</button>

    <div style="margin-top:10px; font-size:10px; display:flex; justify-content:space-between;">
        <span>BROADCAST CHAT:</span>
        <button onclick="clearChat()" style="width:auto; padding:2px 5px; font-size:8px;">CLEAR</button>
    </div>
    <div id="chat-container" style="height:80px; overflow-y:auto; background:#000; border:1px solid #444; padding:5px; font-size:11px;"></div>
    <input type="text" id="chat-input" placeholder="Broadcast..." style="width:100%; background:#111; color:#fff; border:1px solid #666; padding:5px; margin-top:5px;">
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const chatContainer = document.getElementById('chat-container');
    const chatInput = document.getElementById('chat-input');

    // Restore Chat from LocalStorage
    function loadChat() {
        chatContainer.innerHTML = localStorage.getItem('terminal_chat_history') || '';
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function clearChat() {
        localStorage.removeItem('terminal_chat_history');
        chatContainer.innerHTML = '';
    }

    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');

    // Broadcast Logic
    document.getElementById('upload-to-host').onclick = () => {
        const data = localStorage.getItem('webstore_pro_draft');
        if(data) {
            localStorage.setItem('sovereign_live_site', data);
            // Re-render safely
            projector.srcdoc = ''; 
            setTimeout(() => { projector.srcdoc = data; }, 50);
            alert("Broadcast Success.");
        }
    };

    chatInput.onkeypress = (e) => {
        if (e.key === 'Enter' && chatInput.value) {
            const msg = `<div><b>You:</b> ${chatInput.value}</div>`;
            const history = (localStorage.getItem('terminal_chat_history') || '') + msg;
            localStorage.setItem('terminal_chat_history', history);
            chatInput.value = '';
            loadChat();
        }
    };

    window.onload = () => {
        if (localStorage.getItem("KYC_Verified_Hash")) document.getElementById('upload-to-host').style.display = 'block';
        projector.srcdoc = localStorage.getItem('sovereign_live_site') || '';
        loadChat();
    };
  </script>
</body>
</html>
