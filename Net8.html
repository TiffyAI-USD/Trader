<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Gateway Ledger</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text: #f4f4f5;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text);
            letter-spacing: -0.025em;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #a1a1aa;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a1a1aa;
            margin-bottom: 0.5rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        button.secondary:hover {
            background: var(--border);
        }

        #status-box {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            display: none;
        }

        #status-box.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            display: block;
        }

        #status-box.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            display: block;
        }

        .ledger-view {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        pre {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            overflow-x: auto;
            color: #34d399;
            max-height: 200px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TiffyAI Sovereign Gateway</h1>
        <p class="subtitle">Local Ledger Registration & Identity Verification State</p>

        <div class="form-group">
            <label for="nodeId">Node Identifier / Handle</label>
            <input type="text" id="nodeId" placeholder="e.g. node_alpha_01">
        </div>

        <div class="form-group">
            <label for="identityKey">Identity Verification Key</label>
            <input type="password" id="identityKey" placeholder="Enter private key or credential string...">
        </div>

        <div class="actions">
            <button onclick="registerNode()">Register Local State</button>
            <button class="secondary" onclick="clearLedger()">Purge State</button>
        </div>

        <div id="status-box"></div>

        <div class="ledger-view">
            <label>Active Local Storage Ledger (MESH_DIR / State)</label>
            <pre id="ledgerOutput">No state loaded.</pre>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'MESH_DIR';

        function showStatus(message, isError = false) {
            const box = document.getElementById('status-box');
            box.className = isError ? 'error' : 'success';
            box.textContent = message;
        }

        function refreshLedgerView() {
            const data = localStorage.getItem(STORAGE_KEY);
            const output = document.getElementById('ledgerOutput');
            if (!data) {
                output.textContent = "No state registered in MESH_DIR.";
                output.style.color = "#71717a";
            } else {
                output.style.color = "#34d399";
                try {
                    const parsed = JSON.parse(data);
                    output.textContent = JSON.stringify(parsed, null, 2);
                } catch (e) {
                    output.textContent = data;
                }
            }
        }

        function registerNode() {
            const nodeId = document.getElementById('nodeId').value.trim();
            const identityKey = document.getElementById('identityKey').value.trim();

            if (!nodeId || !identityKey) {
                showStatus("Error: Node identifier and identity key are required.", true);
                return;
            }

            try {
                let existingData = {};
                const currentRaw = localStorage.getItem(STORAGE_KEY);
                if (currentRaw) {
                    try { existingData = JSON.parse(currentRaw); } catch(e) { existingData = { raw: currentRaw }; }
                }

                // Construct state payload matching source specifications
                const payload = {
                    ...existingData,
                    nodeId: nodeId,
                    identityKey: identityKey,
                    status: "REGISTERED",
                    lastUpdated: new Date().toISOString()
                };

                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                showStatus("Success: Sovereign gateway state registered to MESH_DIR.");
                refreshLedgerView();
            } catch (err) {
                showStatus("Critical Error writing to storage: " + err.message, true);
            }
        }

        function clearLedger() {
            if (confirm("Are you sure you want to clear the local ledger state?")) {
                localStorage.removeItem(STORAGE_KEY);
                showStatus("Ledger state successfully purged.");
                refreshLedgerView();
            }
        }

        // Initialize view on load
        window.onload = refreshLedgerView;
    </script>
</body>
</html>
