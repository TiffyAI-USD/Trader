<!DOCTYPE html>
<html>
<head>
  <title>TIFFY MESH SYNC</title>
  <style>
    body { background: #000; color: #00f0ff; font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    #status { margin: 20px; font-size: 1.2rem; }
    button { padding: 15px 30px; background: #00f0ff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="status">MESH TERMINAL STANDBY</div>
  <button onclick="syncNetwork()">FORCE NETWORK SYNC</button>

  <script>
    const MESH_KEY = 'MESH_DIR';
    const MASTER_URL = 'https://raw.githubusercontent.com/TiffyAI-USD/Trader/main/MASTER_MESH.json';

    async function syncNetwork() {
      const status = document.getElementById('status');
      status.innerText = "Syncing with Master Registry...";
      
      try {
        // 1. Fetch the master file
        const response = await fetch(MASTER_URL, { cache: 'no-store' });
        const masterMesh = await response.json();

        // 2. Overwrite LocalStorage (Main App reads this)
        localStorage.setItem(MESH_KEY, JSON.stringify(masterMesh));

        // 3. Overwrite IndexedDB (Terminal Persistence)
        const db = await openTiffyDB();
        const tx = db.transaction('StoreData', 'readwrite');
        tx.objectStore('StoreData').put(masterMesh, MESH_KEY);
        
        // 4. Trigger event for Main App
        window.dispatchEvent(new StorageEvent('storage', {
          key: MESH_KEY,
          newValue: JSON.stringify(masterMesh)
        }));

        status.innerText = "SUCCESS: MESH_DIR UPDATED";
      } catch (e) {
        status.innerText = "SYNC FAILED: " + e.message;
      }
    }

    function openTiffyDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('TiffyStoreDB', 1);
        req.onsuccess = (e) => resolve(e.target.result);
      });
    }
  </script>
</body>
</html>
