<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --shocking-pink: #ff00aa; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    #ui-panel { 
      position: fixed; top: 15px; right: 15px; 
      background: rgba(8, 12, 35, 0.45); 
      backdrop-filter: blur(22px); 
      border: 1px solid rgba(0, 240, 255, 0.5); 
      border-radius: 18px; 
      padding: 15px; 
      z-index: 100; 
      width: 320px; 
      max-height: 90vh; 
      overflow-y: auto; 
    }

    button { 
      background: rgba(0, 240, 255, 0.22); 
      border: 1px solid rgba(0, 240, 255, 0.6); 
      color: #fff; 
      padding: 11px; 
      margin: 5px 0; 
      border-radius: 10px; 
      width: 100%; 
      cursor: pointer; 
      font-weight: bold; 
    }

    #toggle-ui { 
      position: fixed; top: 15px; left: 15px; z-index: 200; 
      background: rgba(255,0,170,0.8); 
      border: none; 
      width: 42px; 
      height: 42px; 
      border-radius: 50%; 
      cursor: pointer; 
      font-size: 20px; 
    }

    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 6px 0; color: #ff88cc; font-size: 1.05rem; }
    #chat-container { height: 140px; overflow-y: auto; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,240,255,0.3); padding: 8px; font-size: 11px; margin: 8px 0; }
    .hidden { display: none !important; }

    #search-suggestions {
      position: absolute; width: 288px; background: rgba(6, 10, 35, 0.95); 
      backdrop-filter: blur(18px); border: 1px solid #00f0ff;
      border-radius: 0 0 12px 12px; z-index: 250; max-height: 280px;
      overflow-y: auto; box-shadow: 0 10px 30px rgba(0,240,255,0.4);
    }
    .suggestion-item {
      padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(0,240,255,0.2);
    }
    .suggestion-item:hover { background: rgba(0,240,255,0.3); color: #00f0ff; }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" background="color: #000000">
      <a-assets>
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
      </a-assets>
      <a-sky src="#bg-video" rotation="0 -90 0" animation="property: rotation; from: 0 -90 0; to: 0 270 0; loop: true; dur: 90000; easing: linear"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px; font-size:1.25rem; color:#00f0ff;">TIFFY MESH TERMINAL</div>
    
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>

    <input type="text" id="search-bar" placeholder="Search stores... (shoes, food...)" style="width:100%; padding:10px; background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(0,240,255,0.5); border-radius:10px;">
    <div id="search-suggestions"></div>

    <iframe id="projector-lens" allow="fullscreen" allowfullscreen="true" style="height:210px; border:1px solid rgba(0,240,255,0.4);"></iframe>

    <div style="display:flex; gap:5px;">
        <button onclick="loadHome()" style="background:rgba(80,80,80,0.6);">HOME</button>
        <button onclick="clearViewer()" style="background:rgba(200,0,0,0.6);">CLEAR</button>
    </div>

    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html', '_blank')" style="background: rgba(40,170,70,0.7);">EDIT STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')" style="background: rgba(80,80,80,0.7);">BANKING</button>

    <div style="margin-top:12px; font-size:10px; color:#aaa;">LIVE CHAT</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type message..." style="width:100%; padding:9px; background:rgba(0,0,0,0.4); color:#fff; border:1px solid rgba(0,240,255,0.4); border-radius:8px; margin-top:8px;">
  </div>

  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*" style="width:100%; margin:8px 0;">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html" style="width:100%; margin:8px 0;">
    <button onclick="deployStore()" style="margin-top:12px; padding:14px;">CONFIRM & DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

<script>
// IndexedDB
const DB_NAME = 'TiffyStoreDB';
const STORE_NAME = 'StoreData';

async function getFromIDB(key) {
    try {
        const db = await new Promise(r => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
            req.onsuccess = e => r(e.target.result);
        });
        return new Promise(r => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => r(req.result);
        });
    } catch(e) { return null; }
}

async function saveToIDB(key, value) {
    try {
        const db = await new Promise(r => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onsuccess = e => r(e.target.result);
        });
        return new Promise(r => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(value, key);
            tx.oncomplete = () => r(true);
        });
    } catch(e) { return false; }
}

let meshDir = {};
const projector = document.getElementById('projector-lens');
const searchBar = document.getElementById('search-bar');
const suggestionsBox = document.getElementById('search-suggestions');

async function deployStore() {
    const isVerified = localStorage.getItem("verified") || localStorage.getItem("KYC_Verified_Hash");
    if (!isVerified) {
        if (!document.getElementById('kyc-modal')) {
            const modal = document.createElement('div');
            modal.id = 'kyc-modal';
            modal.style.cssText = 'position:fixed; top:20%; left:30%; width:320px; background:#111; padding:20px; border:2px solid #FF007F; z-index:999; color:#fff; border-radius:15px; text-align:center;';
            modal.innerHTML = `
                <h3>ACTION REQUIRED</h3>
                <p>Top up + complete KYC to deploy stores.</p>
                <button onclick="window.open('https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=NVPAZWBES9WAS', '_blank')">TOP UP</button>
                <button onclick="window.open('https://tiffyai-usd.github.io/KYC/', '_blank')">DO KYC</button>
                <button onclick="this.parentElement.remove()">CLOSE</button>
            `;
            document.body.appendChild(modal);
        }
        return;
    }

    const hFile = document.getElementById('html-input').files[0];
    const tFile = document.getElementById('thumb-input').files[0];
    if (!hFile || !tFile) return alert("Please select both files");

    const html = await hFile.text();
    const thumb = await new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result);
        fr.readAsDataURL(tFile);
    });

    const draft = localStorage.getItem('webstore_pro_draft');
    const name = draft ? JSON.parse(draft).name || "My Store" : "My Store";

    const storeData = { id: 'store_' + Date.now(), name, html, thumb, timestamp: Date.now() };
    meshDir[storeData.id] = storeData;
    await saveToIDB('MESH_DIR', meshDir);

    renderPortals();
    document.getElementById('upload-modal').classList.add('hidden');
    alert(`✅ ${name} deployed!`);
}

function renderPortals() {
    // AR rendering (basic)
    console.log("Stores loaded:", Object.keys(meshDir).length);
}

function showSuggestions(matches) {
    suggestionsBox.innerHTML = '';
    if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
    }
    matches.forEach(store => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.textContent = store.name;
        div.onclick = () => {
            searchBar.value = store.name;
            suggestionsBox.style.display = 'none';
            const blob = new Blob([store.html], {type: 'text/html'});
            window.open(URL.createObjectURL(blob), '_blank');
        };
        suggestionsBox.appendChild(div);
    });
    suggestionsBox.style.display = 'block';
}

searchBar.addEventListener('input', () => {
    const query = searchBar.value.toLowerCase().trim();
    if (query.length < 1) {
        suggestionsBox.style.display = 'none';
        return;
    }
    const matches = Object.values(meshDir).filter(s => s.name.toLowerCase().includes(query));
    showSuggestions(matches);
});

function loadHome() { projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/v6.html'; }
function clearViewer() { projector.src = ''; }

window.onload = async () => {
    const saved = await getFromIDB('MESH_DIR');
    if (saved) meshDir = saved;
    renderPortals();
};
</script>
</body>
</html>
