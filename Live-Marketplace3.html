<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; margin: 0; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; transition: transform 0.3s; }
    #ui-panel.hidden { transform: translateX(350px); }
    #upload-modal { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: #111; padding: 20px; border: 2px solid var(--electric-blue); z-index: 1000; color: #fff; border-radius: 15px; }
    #projector-lens { width: 100%; height: 300px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 4px 0; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    #chat-container { height: 140px; overflow-y: auto; background: #000; border: 1px solid #444; padding: 8px; font-size: 11px; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-camera position="0 1.6 0"></a-camera>
      <a-sky color="#111"></a-sky>
    </a-scene>
  </div>

  <button id="toggle-ui" style="position:fixed; top:20px; right:20px; z-index:101; width:40px; height:40px; border-radius:50%;">></button>
  
  <div id="ui-panel">
    <div style="text-align:center; font-family:'Orbitron'; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    <iframe id="projector-lens"></iframe>
    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" style="width:100%; background:#111; border:1px solid #666; color:#fff; padding:8px;" placeholder="Chat...">
    <button onclick="clearChat()" style="background:#444;">CLEAR CHAT</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3>Deploy to Mesh</h3>
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html">
    <button onclick="processUpload()">DEPLOY</button>
    <button onclick="this.parentElement.classList.add('hidden')">CANCEL</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const scene = document.querySelector('a-scene');
    let connections = [];
    
    // Peer setup
    const peer = new Peer('tiffy-trader-global-mesh');
    peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (d) => { if(d.type === 'STORE') setupWorkspace(d.html, d.thumb); if(d.type === 'CHAT') appendChat(d.msg, false); });
    });

    function setupWorkspace(html, thumb) {
        localStorage.setItem('sovereign_html', html);
        localStorage.setItem('sovereign_thumb', thumb);
        renderAR(thumb, html);
        const doc = projector.contentDocument || projector.contentWindow.document;
        doc.open(); doc.write(html); doc.close();
    }

    function renderAR(thumb, html) {
        const old = document.getElementById('user-thumb');
        if (old) old.remove();
        const obj = document.createElement(thumb === 'placeholder' ? 'a-box' : 'a-plane');
        obj.setAttribute('id', 'user-thumb');
        obj.setAttribute('position', '0 1.5 -3');
        if (thumb === 'placeholder') {
            obj.setAttribute('color', '#FF007F');
            obj.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000');
        } else {
            obj.setAttribute('src', thumb);
        }
        obj.addEventListener('click', () => { const doc = projector.contentDocument || projector.contentWindow.document; doc.open(); doc.write(html); doc.close(); });
        scene.appendChild(obj);
    }

    async function processUpload() {
        if (!localStorage.getItem("KYC_Verified_Hash")) { alert("KYC Required!"); return; }
        const hFile = document.getElementById('html-input').files[0];
        const tFile = document.getElementById('thumb-input').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const html = e.target.result;
            if (tFile) {
                const tr = new FileReader();
                tr.onload = (te) => { setupWorkspace(html, te.target.result); connections.forEach(c => c.send({type:'STORE', html, thumb: te.target.result})); };
                tr.readAsDataURL(tFile);
            } else { setupWorkspace(html, 'placeholder'); connections.forEach(c => c.send({type:'STORE', html, thumb: 'placeholder'})); }
            document.getElementById('upload-modal').classList.add('hidden');
        };
        reader.readAsText(hFile);
    }

    function appendChat(msg, local) {
        const d = document.createElement('div'); d.textContent = "> " + msg;
        document.getElementById('chat-container').appendChild(d);
        if(local) connections.forEach(c => c.send({type:'CHAT', msg}));
    }

    document.getElementById('chat-input').onkeypress = (e) => { if(e.key==='Enter') { appendChat(e.target.value, true); e.target.value=''; } };
    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');
    function clearChat() { document.getElementById('chat-container').innerHTML = ''; }

    window.onload = () => {
        const h = localStorage.getItem('sovereign_html');
        const t = localStorage.getItem('sovereign_thumb');
        if (h && t) setupWorkspace(h, t);
    };
  </script>
</body>
</html>
