<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mesh Network Hub Bridge</title>
</head>
<body>
    <h1 id="status">Syncing with Network Hub...</h1>

    <script>
        const HUB_FILE = 'mesh_master.json'; // The central file
        const DB_NAME = 'TiffyStoreDB';
        const STORE_NAME = 'StoreData';

        async function syncNetwork() {
            const status = document.getElementById('status');
            
            // 1. Open Local Database
            const db = await new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });

            const tx = db.transaction([STORE_NAME], 'readwrite');
            const store = tx.objectStore(STORE_NAME);

            // 2. FETCH MASTER (Pull the network state)
            try {
                const response = await fetch(HUB_FILE);
                const masterMesh = await response.json();

                // 3. OVERWRITE LOCAL (Force local MESH_DIR to match Master)
                const putReq = store.put(masterMesh, 'MESH_DIR');
                
                putReq.onsuccess = () => {
                    status.innerText = "Success: Network State Synchronized.";
                    console.log("Master Mesh loaded into Local MESH_DIR.");
                    // After syncing, we could reload the page or terminal here
                };
            } catch (err) {
                // If it fails, we assume this node is the one PUSHING data
                const getReq = store.get('MESH_DIR');
                getReq.onsuccess = (e) => {
                    const localMesh = e.target.result;
                    status.innerText = "Error reading master. (If you are pushing, please check master file availability)";
                    console.error("Fetch failed. Cannot pull master data.");
                };
            }
        }

        syncNetwork();
    </script>
</body>
</html>
