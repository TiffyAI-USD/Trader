<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; width: 320px; max-height: 95vh; overflow-y: auto; }
    #projector-lens { width: 100%; height: 300px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 4px 0; border-radius: 10px; width: 100%; cursor: pointer; }
    #chat-container { height: 140px; overflow-y: auto; background: #000; border: 1px solid #444; padding: 8px; font-size: 11px; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-camera position="0 1.6 0"></a-camera>
      <a-sphere position="0 2 -5" radius="1.5" color="#007BFF" opacity="0.2" wireframe="true"></a-sphere>
    </a-scene>
  </div>
  
  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center;">TIFFYAI TERMINAL</div>
    <iframe id="projector-lens"></iframe>
    <button onclick="loadHome()">HOME</button>
    <button id="upload-store-btn" style="background:#d4a373;">UPLOAD STORE</button>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type and Enter...">
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const chatContainer = document.getElementById('chat-container');
    const peer = new Peer('tiffy-trader-main-' + Math.floor(Math.random()*10000));
    let connections = [];

    // --- Persistence & Sync ---
    function saveChat(msg) {
        let history = JSON.parse(localStorage.getItem('chat_history') || '[]');
        history.push(msg);
        localStorage.setItem('chat_history', JSON.stringify(history));
    }

    function setupWorkspace(html, thumb) {
        localStorage.setItem('sovereign_html', html);
        localStorage.setItem('sovereign_thumb', thumb);
        renderThumbnail(thumb, html);
        renderIframe(html);
    }

    function renderIframe(html) {
        const doc = projector.contentDocument || projector.contentWindow.document;
        doc.open(); doc.write(html); doc.close();
    }

    // --- Network ---
    peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => {
            if (data.type === 'STORE') setupWorkspace(data.html, data.thumb);
            if (data.type === 'CHAT') appendChat(data.msg, false);
        });
    });

    // --- Upload Flow ---
    document.getElementById('upload-store-btn').onclick = () => {
        const imgInput = document.createElement('input'); imgInput.type = 'file'; imgInput.accept = 'image/*';
        imgInput.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (re) => {
                const htmlInput = document.createElement('input'); htmlInput.type = 'file'; htmlInput.accept = '.html';
                htmlInput.onchange = (he) => {
                    const readerH = new FileReader();
                    readerH.onload = (rh) => {
                        setupWorkspace(rh.target.result, re.target.result);
                        connections.forEach(c => c.send({ type: 'STORE', html: rh.target.result, thumb: re.target.result }));
                    };
                    readerH.readAsText(he.target.files[0]);
                };
                htmlInput.click();
            };
            reader.readAsDataURL(e.target.files[0]);
        };
        imgInput.click();
    };

    // --- Chat ---
    function appendChat(msg, isLocal = true) {
        const d = document.createElement('div'); d.textContent = "> " + msg;
        chatContainer.appendChild(d);
        if (isLocal) { saveChat(msg); connections.forEach(c => c.send({ type: 'CHAT', msg: msg })); }
    }

    document.getElementById('chat-input').onkeypress = (e) => {
        if(e.key === 'Enter') { appendChat(e.target.value); e.target.value = ''; }
    };

    window.onload = () => {
        // Restore Chat
        const chat = JSON.parse(localStorage.getItem('chat_history') || '[]');
        chat.forEach(m => appendChat(m, false));
        // Restore Workspace
        const h = localStorage.getItem('sovereign_html');
        const t = localStorage.getItem('sovereign_thumb');
        if (h && t) setupWorkspace(h, t); else loadHome();
    };

    function loadHome() { projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html'; }
    function renderThumbnail(thumb, html) {
        const p = document.createElement('a-plane');
        p.setAttribute('position', '0 1.5 -3'); p.setAttribute('src', thumb);
        p.addEventListener('click', () => renderIframe(html));
        document.querySelector('a-scene').appendChild(p);
    }
  </script>
</body>
</html>
