<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TIFFYVERSE • Sovereign Engine</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; font-family: 'Poppins', sans-serif; overflow: hidden; }
        #ui-panel { position: fixed; top: 20px; right: 20px; width: 320px; background: rgba(0, 0, 0, 0.9); border: 2px solid #007BFF; border-radius: 20px; padding: 20px; color: #fff; z-index: 1000; }
        .stat-row { font-family: 'Orbitron'; color: #FF007F; margin: 5px 0; }
        #projector-lens { width: 100%; height: 200px; background: #fff; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
        button { width: 100%; padding: 12px; margin: 5px 0; background: #007BFF; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        #chat-container { height: 100px; overflow-y: auto; background: #111; border: 1px solid #444; padding: 8px; font-size: 11px; margin-bottom: 5px; }
    </style>
</head>
<body>

<a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-assets><video id="bg-video" loop="true" src="environment.mp4" crossorigin="anonymous" autoplay="true" muted="true"></video></a-assets>
    <a-videosphere src="#bg-video" rotation="0 -90 0"></a-videosphere>
    <a-entity camera look-controls wasd-controls position="0 1.6 0"><a-cursor></a-cursor></a-entity>
    <a-entity id="marketplace-root"></a-entity>
</a-scene>

<div id="ui-panel">
    <h3 style="font-family:Orbitron;">TIFFYVERSE</h3>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>
    <iframe id="projector-lens"></iframe>
    <button onclick="publishToVerse()" style="background:#FF007F;">PUBLISH TO T-VERSE</button>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Chat..." style="width:100%; padding:8px;" onkeypress="handleChat(event)">
</div>

<script>
    // 1. IMPROVED COMPILER: Maps your JSON to the final Store HTML
    function compileBackground() {
        const json = localStorage.getItem('webstore_pro_draft');
        if (!json) return;
        const d = JSON.parse(json);
        // This maps your specific JSON fields into the final view
        const html = `<html><head><style>.banner{width:100.1%;}</style></head><body>
                      <img src="banner.jpg" class="banner">
                      <h1>${d.name || 'Store'}</h1>
                      <p>${d.tag || ''}</p>
                      <a href="https://wa.me/${d.phone}">ORDER NOW</a>
                      </body></html>`;
        localStorage.setItem('Prepped_HTML_Buffer', html);
    }

    // 2. Chat logic
    function handleChat(e) {
        if (e.key === 'Enter' && e.target.value) {
            const hist = (localStorage.getItem('terminal_chat_history') || '') + `<div><b>You:</b> ${e.target.value}</div>`;
            localStorage.setItem('terminal_chat_history', hist);
            document.getElementById('chat-container').innerHTML = hist;
            e.target.value = '';
        }
    }

    // 3. AR Renderer: Creates the floating thumbnail
    function renderMarketplace() {
        const root = document.getElementById('marketplace-root');
        root.innerHTML = '';
        const el = document.createElement('a-entity');
        el.setAttribute('position', '0 1.5 -3');
        el.innerHTML = `<a-sphere class="clickable" color="#007BFF" radius="0.4"></a-sphere>`;
        el.addEventListener('click', () => {
            const prepped = localStorage.getItem('Prepped_HTML_Buffer');
            if(prepped) document.getElementById('projector-lens').srcdoc = prepped;
        });
        root.appendChild(el);
    }

    window.onload = () => {
        document.getElementById('tiffy-counter').innerText = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
        document.getElementById('tusd-counter').innerText = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
        document.getElementById('chat-container').innerHTML = localStorage.getItem('terminal_chat_history') || '';
        
        // Initial Compile and Render
        compileBackground();
        renderMarketplace();
        
        // Background loop to keep buffer "Live"
        setInterval(compileBackground, 2000);
    };

    function publishToVerse() {
        const html = localStorage.getItem('Prepped_HTML_Buffer');
        const kyc = localStorage.getItem("KYC_Verified_Hash");
        if(html && kyc) { 
            localStorage.setItem(kyc + "_Webpage", html); 
            alert("Published to T-Verse successfully!"); 
        } else {
            alert("Missing Data: Ensure you have built a store and performed KYC.");
        }
    }
</script>
</body>
</html>
