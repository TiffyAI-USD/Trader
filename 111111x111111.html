<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIFFY Trader • Sovereign Mesh Terminal | Full Production Build</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --bg-panel: rgba(8, 12, 35, 0.9); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; }
        #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-panel { position: fixed; top: 20px; right: 20px; width: 360px; max-height: 95vh; background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 20px; z-index: 100; overflow-y: auto; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
        .terminal-header { font-family: 'Orbitron'; text-align: center; color: var(--electric-blue); margin-bottom: 20px; font-size: 1.2rem; letter-spacing: 2px; }
        .stat-row { font-family: 'Orbitron'; text-align: center; margin: 10px 0; color: var(--shocking-pink); font-size: 0.95rem; background: #000; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        button { background: rgba(0,240,255,0.05); border: 1px solid var(--electric-blue); color: #fff; padding: 14px; margin: 6px 0; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        button:hover { background: var(--electric-blue); color: #000; }
        #projector-lens { width: 100%; height: 220px; border: 1px solid #444; border-radius: 8px; margin: 12px 0; background: #111; }
        #chat-container { height: 160px; overflow-y: auto; background: #000; border: 1px solid #333; padding: 10px; font-size: 11px; margin: 10px 0; border-radius: 6px; }
        #local-video { width: 100%; border: 1px solid #555; border-radius: 8px; margin: 8px 0; }
        #upload-modal { position: fixed; top: 10%; left: 10%; width: 80%; height: 80%; background: rgba(0,0,0,0.98); padding: 40px; border: 2px solid var(--electric-blue); z-index: 5000; border-radius: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')" style="position:fixed; top:20px; left:20px; z-index:200; width:50px; height:50px; border-radius:50%; background:var(--shocking-pink); border:none; cursor:pointer;">☰</button>

<div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
        <a-assets>
            <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
        </a-assets>
        <a-sky src="#bg-video" rotation="0 -90 0"></a-sky>
        <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
</div>

<div id="ui-panel">
    <div class="terminal-header">TIFFY MESH TERMINAL</div>
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD NITRO: 0.00</div>
    
    <input type="text" id="search-bar" placeholder="Search Mesh Nodes..." style="width:100%; padding:10px; background:#111; color:#fff; border:1px solid #444; border-radius:8px;">
    <button onclick="searchMesh()">SEARCH MATRIX</button>
    
    <iframe id="projector-lens" allow="fullscreen" allowfullscreen="true"></iframe>
    
    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">DEPLOY STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/v6.html', '_blank')" style="background: #28a745;">EDIT STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')">BANKING</button>

    <video id="local-video" autoplay playsinline muted></video>
    <button onclick="toggleVideo()">📹 VIDEO LINK</button>

    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Mesh Broadcast..." style="width:100%; padding:10px; background:#000; color:#fff; border:1px solid #444; border-radius:8px;">
</div>

<div id="upload-modal" class="hidden">
    <h2>MESH NODE DEPLOYMENT</h2>
    <input type="text" id="node-name" placeholder="Node Identity" style="width:100%; padding:12px; margin:10px 0; background:#111; border:1px solid #555; color:#fff;">
    <input type="file" id="thumb-input" accept="image/*" style="width:100%; margin:10px 0;">
    <input type="file" id="html-input" accept=".html" style="width:100%; margin:10px 0;">
    <button id="deploy-btn" onclick="executeDeployment()" style="background:var(--electric-blue); color:#000;">COMMIT TO LEDGER</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')" style="background:#444;">CANCEL</button>
</div>

<script>
    /* PRODUCTION-GRADE MESH ARCHITECTURE - RESTORED */
    const CONFIG = { dbName: 'TiffyStoreDB', storeName: 'StoreData' };
    let db, meshDir = {}, localStream, peer = new Peer();

    async function initMesh() {
        log("System Boot: Initializing Mesh Protocols...");
        try {
            const req = indexedDB.open(CONFIG.dbName, 1);
            req.onupgradeneeded = e => {
                log("DB Schema Update: Initializing Registry...");
                e.target.result.createObjectStore(CONFIG.storeName);
            };
            req.onsuccess = e => {
                db = e.target.result;
                syncData();
            };
            updateFinancials();
        } catch (err) { log("ERR: Boot Failed: " + err.message); }
    }

    function log(msg) {
        const container = document.getElementById('chat-container');
        const entry = document.createElement('div');
        entry.textContent = `> ${new Date().toLocaleTimeString()} :: ${msg}`;
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
    }

    async function syncData() {
        const tx = db.transaction(CONFIG.storeName, 'readonly').objectStore(CONFIG.storeName).get('MESH_DIR');
        tx.onsuccess = () => {
            meshDir = tx.result || {};
            renderPortals();
            log("Mesh Registry Synced. Nodes: " + Object.keys(meshDir).length);
        };
    }

    async function executeDeployment() {
        if (!localStorage.getItem("KYC_Verified_Hash")) {
            log("Security Alert: Authorization Required.");
            alert("Identity fingerprinting failed. Please complete KYC via Gateway.");
            return;
        }

        const btn = document.getElementById('deploy-btn');
        const name = document.getElementById('node-name').value;
        const htmlFile = document.getElementById('html-input').files[0];
        const thumbFile = document.getElementById('thumb-input').files[0];

        if (!name || !htmlFile || !thumbFile) {
            log("ERR: Deployment failed - Missing required data artifacts.");
            return;
        }

        btn.disabled = true;
        btn.textContent = "WRITING TO LEDGER...";

        const reader = new FileReader();
        reader.onload = (e) => {
            const htmlContent = e.target.result;
            const thumbReader = new FileReader();
            
            thumbReader.onload = (t) => {
                meshDir['node_' + Date.now()] = { name, html: htmlContent, thumb: t.target.result };
                const tx = db.transaction(CONFIG.storeName, 'readwrite');
                tx.objectStore(CONFIG.storeName).put(meshDir, 'MESH_DIR');
                tx.oncomplete = () => {
                    log("Deployment Confirmed: Node indexed to ledger.");
                    document.getElementById('upload-modal').classList.add('hidden');
                    renderPortals();
                    btn.disabled = false;
                    btn.textContent = "COMMIT TO LEDGER";
                };
            };
            thumbReader.readAsDataURL(thumbFile);
        };
        reader.readAsText(htmlFile);
    }

    function renderPortals() {
        const arPortal = document.getElementById('ar-portal');
        arPortal.innerHTML = '';
        Object.entries(meshDir).forEach(([id, biz], i) => {
            const el = document.createElement('a-plane');
            el.setAttribute('position', `${(i * 1.5) - 1} 0.5 -3`);
            el.setAttribute('material', `src: ${biz.thumb}; side: double`);
            el.setAttribute('class', 'clickable');
            el.addEventListener('click', () => {
                const blob = new Blob([biz.html], {type: 'text/html'});
                document.getElementById('projector-lens').src = URL.createObjectURL(blob);
                log("Displaying node: " + biz.name);
            });
            arPortal.appendChild(el);
        });
    }

    async function toggleVideo() {
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
            log("Camera: Offline.");
        } else {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('local-video').srcObject = localStream;
                log("Camera: Online. Mesh uplink active.");
            } catch(e) { log("ERR: Access denied."); }
        }
    }

    function updateFinancials() {
        document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
        document.getElementById('tusd-counter').textContent = `TUSD NITRO: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
    }

    window.onload = initMesh;
</script>
</body>
</html>
