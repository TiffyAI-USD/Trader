<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.9); border: 1px solid #444; padding: 15px; z-index: 100; width: 300px; }
    #projector-lens { width: 100%; height: 200px; background: #000; border: 1px solid #444; margin: 10px 0; }
    #upload-modal { position: fixed; top: 20%; left: 10%; width: 80%; background: #222; padding: 20px; z-index: 999; border-radius: 10px; }
    .hidden { display: none !important; }
    button { padding: 10px; width: 100%; margin: 5px 0; cursor: pointer; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <iframe id="projector-lens"></iframe>
    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
    <button onclick="clearAll()" style="background:#800;">HARD RESET</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <input type="file" id="thumb-input" accept="image/*"><br><br>
    <input type="file" id="html-input" accept=".html"><br><br>
    <button onclick="deployStore()">CONFIRM DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const arPortal = document.getElementById('ar-portal');
    const peer = new Peer();

    function deployStore() {
        const hFile = document.getElementById('html-input').files[0];
        const tFile = document.getElementById('thumb-input').files[0];
        
        if (!hFile) { alert("Select HTML file!"); return; }

        const reader = new FileReader();
        reader.onload = (e) => {
            const html = e.target.result;
            
            if (tFile) {
                const tReader = new FileReader();
                tReader.onload = (te) => {
                    const thumb = te.target.result;
                    saveAndRender(html, thumb);
                };
                tReader.readAsDataURL(tFile);
            } else {
                saveAndRender(html, null);
            }
        };
        reader.readAsText(hFile);
    }

    function saveAndRender(html, thumb) {
        localStorage.setItem('ar_store_html', html);
        if(thumb) localStorage.setItem('ar_store_thumb', thumb);
        
        // Update View
        projector.src = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
        renderAR(html, thumb);
        document.getElementById('upload-modal').classList.add('hidden');
    }

    function renderAR(html, thumb) {
        arPortal.innerHTML = '';
        const el = document.createElement('a-plane');
        el.setAttribute('width', '1.5');
        el.setAttribute('height', '1.2');
        if(thumb) el.setAttribute('material', `src: url(${thumb})`);
        else el.setAttribute('material', 'color: #FF007F');
        el.addEventListener('click', () => {
            const b = new Blob([html], {type: 'text/html'});
            window.open(URL.createObjectURL(b), '_blank');
        });
        arPortal.appendChild(el);
    }

    function clearAll() { localStorage.clear(); window.location.reload(); }

    window.onload = () => {
        const h = localStorage.getItem('ar_store_html');
        const t = localStorage.getItem('ar_store_thumb');
        if(h) {
            projector.src = URL.createObjectURL(new Blob([h], {type: 'text/html'}));
            renderAR(h, t);
        }
    };
  </script>
</body>
</html>
