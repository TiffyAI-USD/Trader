<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; margin: 0; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 20px; z-index: 100; width: 340px; transition: transform 0.3s ease-in-out; }
    #ui-panel.hidden { transform: translateX(400px); }
    #toggle-ui { position: fixed; top: 20px; left: 20px; z-index: 999; background: var(--shocking-pink); border: none; color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #projector-lens { width: 100%; height: 250px; background: #000; border: 1px solid #444; border-radius: 8px; margin: 10px 0; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">MENU</button>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse">
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>
  
  <div id="ui-panel">
    <h3 style="text-align:center; margin-bottom:10px;">MESH TERMINAL</h3>
    <input type="text" id="search-bar" placeholder="Enter Business Name..." style="width:100%; padding:10px; background:#111; color:#fff; border:1px solid #444; border-radius:8px;">
    <button onclick="searchMesh()">SEARCH MESH</button>
    <iframe id="projector-lens"></iframe>
    <button onclick="loadHome()" style="background:#444;">HOME</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const arPortal = document.getElementById('ar-portal');
    const peer = new Peer(); // Unique node
    let meshDirectory = JSON.parse(localStorage.getItem('MESH_DIR') || '{}');

    // 1. SEARCH MESH
    function searchMesh() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const found = Object.values(meshDirectory).find(b => b.name.toLowerCase().includes(query));
        if (found) {
            const blob = new Blob([found.html], {type: 'text/html'});
            projector.src = URL.createObjectURL(blob);
        } else { alert("Node not found in current sector."); }
    }

    // 2. HANDSHAKE: Share Business Data
    peer.on('connection', (conn) => {
        conn.on('data', (d) => {
            if(d.type === 'HELLO') {
                meshDirectory[d.id] = { name: d.name, html: d.html, thumb: d.thumb };
                localStorage.setItem('MESH_DIR', JSON.stringify(meshDirectory));
                renderPortals();
            }
        });
    });

    // 3. BROADCAST: Tell everyone who I am
    peer.on('open', (id) => {
        const myStore = JSON.parse(localStorage.getItem('webstore_pro_draft') || '{}');
        const myHtml = localStorage.getItem('ar_store_html') || '';
        if (myStore.name) {
            meshDirectory[id] = { name: myStore.name, html: myHtml, thumb: myStore.logo };
            // Broadcast to new peers as they join
        }
    });

    function renderPortals() {
        arPortal.innerHTML = '';
        Object.entries(meshDirectory).forEach(([id, biz], i) => {
            const el = document.createElement('a-plane');
            el.setAttribute('position', `${(i * 1.5) - 1.5} 0 0`);
            el.setAttribute('material', `src: url(${biz.thumb}); side: double`);
            el.addEventListener('click', () => {
                const blob = new Blob([biz.html], {type: 'text/html'});
                projector.src = URL.createObjectURL(blob);
            });
            arPortal.appendChild(el);
        });
    }

    function loadHome() { projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/BusinessBox.html'; }
    window.onload = renderPortals;
  </script>
</body>
</html>
