<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root { --gold: #d4a373; --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; }
    
    /* Force full AR coverage */
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    /* Scrollable UI Panel */
    #ui-panel {
      position: fixed; top: 10px; right: 10px; width: 280px; max-height: 90vh;
      background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(10px);
      border: 1px solid var(--gold); border-radius: 16px; padding: 15px;
      z-index: 100; overflow-y: auto; transition: transform 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(310px); }
    
    #projector-lens { width: 100%; height: 150px; background: #000; border: 1px solid var(--gold); margin: 10px 0; }
    button { background: var(--gold); border: none; color: #000; padding: 10px; margin: 5px 0; border-radius: 20px; width: 100%; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </div>

  <div id="ui-panel">
    <h3 style="color:var(--gold);">SOVEREIGN TERMINAL</h3>
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    
    <div style="font-size:10px; margin-top:10px;">LIVE PREVIEW:</div>
    <iframe id="projector-lens"></iframe>
    
    <!-- Unified Upload: Looks for the same key as Webstore Pro -->
    <button id="upload-to-host" style="display:none; background:#25D366;">ACTIVATE STOREFRONT</button>
    <button id="visit-site">OPEN FULL PREVIEW</button>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const uploadBtn = document.getElementById('upload-to-host');

    function initTerminal() {
        // 1. Check KYC (Matches your registry)
        const isVerified = localStorage.getItem("KYC_Verified_Hash");
        if (isVerified) uploadBtn.style.display = 'block';

        // 2. Load the actual store data from the Webstore Pro draft
        const draft = localStorage.getItem('webstore_pro_draft');
        if (draft) {
            // We load the draft into the projector
            // Note: Since Webstore Pro is a full page, we inject it into the iframe
            // You may need to tweak the projector to load the page content dynamically
            projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/'; 
        }
    }

    uploadBtn.onclick = () => {
        alert("Storefront Broadcast Enabled on Ledger.");
        // Logic to push your verified hash to the network
    };

    window.onload = initTerminal;
  </script>
</body>
</html>
