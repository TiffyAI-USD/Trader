<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; --gold: #d4a373; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    
    /* AR SCENE - Fixed & Full */
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    /* UI PANEL - Scrollable & Fixed */
    #ui-panel {
      position: fixed; top: 10px; right: 10px; width: 280px; 
      max-height: 90vh; /* This allows scrolling */
      overflow-y: auto; /* Enable scroll */
      background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(12px);
      border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px;
      z-index: 100; transition: transform 0.3s ease;
    }
    #ui-panel.hidden { transform: translateX(310px); }
    
    #debug-log { font-size: 9px; color: #666; margin-top: 10px; height: 60px; overflow-y: auto; background: #000; padding: 5px; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 5px 0; border-radius: 12px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; color:var(--shocking-pink); text-align:center; margin-bottom:10px;">TIFFYAI TERMINAL</div>
    <button id="toggle-ui" style="background:#444;">HIDE/SHOW UI</button>
    
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    <button id="upload-to-host" style="display:none; background:var(--gold); color:#000;">VERIFIED: UPLOAD TO HOST</button>
    <button onclick="document.getElementById('prod-upload').click()">IMPORT WEBSTORE</button>
    <input type="file" id="prod-upload" style="display:none;">
    
    <div id="chat-container" style="margin-top:10px; height:80px; overflow-y:auto; border:1px solid #333; font-size:11px;"></div>
    <div id="debug-log"></div>
  </div>

  <script>
    const logEl = document.getElementById('debug-log');
    const uploadBtn = document.getElementById('upload-to-host');

    function log(msg) { logEl.innerHTML += `<div>${new Date().toLocaleTimeString()} ${msg}</div>`; }

    // Unified Initialization
    window.onload = () => {
        // 1. KYC Gatekeeper
        const kycHash = localStorage.getItem("KYC_Verified_Hash");
        if (kycHash && kycHash.length > 5) {
            uploadBtn.style.display = 'block';
            log("Sovereign Identity Verified.");
        } else {
            log("GUEST MODE: No KYC Hash.");
        }

        // 2. Import Logic (Links Builder Draft to Dashboard)
        document.getElementById('prod-upload').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                localStorage.setItem('pending_store_upload', ev.target.result);
                log("Storefront Draft Staged.");
            };
            reader.readAsText(file);
        };

        // 3. Hosting Logic
        uploadBtn.onclick = () => {
            const data = localStorage.getItem('pending_store_upload');
            if(data) {
                localStorage.setItem('sovereign_live_site', data);
                log("Broadcast Success: Website Live.");
            } else {
                log("Error: No Draft Found.");
            }
        };
    };
  </script>
</body>
</html>
