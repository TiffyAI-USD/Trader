<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FF007F" />
  <link rel="icon" href="icon.png" type="image/png" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; touch-action: pan-y; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #ui-panel { position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.9); backdrop-filter: blur(12px); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; z-index: 100; max-width: 300px; box-shadow: 0 0 20px rgba(0, 123, 255, 0.4); transition: all 0.3s ease; }
    #ui-panel.hidden { transform: translateX(320px); }
    #toggle-ui { position: fixed; top: 20px; right: 20px; z-index: 101; background: var(--shocking-pink); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    #tiffy-counter, #tusd-counter { font-family: 'Orbitron', sans-serif; font-size: 20px; color: var(--shocking-pink); text-shadow: 0 0 10px var(--shocking-pink); text-align: center; margin-bottom: 8px; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px 16px; margin: 6px 0; border-radius: 12px; width: 100%; font-weight: 500; cursor: pointer; transition: 0.3s; font-size: 14px; }
    #projector-lens { width: 100%; height: 100px; background: #000; border: 1px solid var(--electric-blue); border-radius: 8px; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div id="loader"><h2>TIFFYAI • Sovereign Portal</h2></div>
  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0" wasd-controls-enabled="false"></a-camera>
    </a-scene>
  </div>

  <button id="toggle-ui">></button>
  <div id="ui-panel">
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    <div id="tusd-counter">TUSD Nitro: 0.00</div>
    <button id="refresh-balances">Sync Bank Ledger</button>
    <button id="share-button">Share & Earn</button>
    <button id="start-trading">Start 2 Trades</button>
    <button id="claim-rewards">Claim Rewards</button>
    <hr style="margin:10px 0; border:0; border-top:1px solid #444;">
    
    <div style="font-size:10px; color:#aaa;">LIVE PROJECTOR:</div>
    <iframe id="projector-lens"></iframe>
    
    <input type="file" id="prod-upload" style="display:none;">
    <button onclick="document.getElementById('prod-upload').click()">UPLOAD PRODUCT</button>
    <button id="upload-to-host" style="background: var(--electric-blue);">UPLOAD TO HOST</button>
    <button id="visit-site" style="background: #28a745;">VISIT WEBSITE</button>

    <div id="chat-container" style="margin-top:10px; background:#000; border:1px solid #444; height:80px; overflow-y:auto; padding:5px; font-size:12px;"></div>
    <input type="text" id="chat-input" placeholder="Type to broadcast..." style="width:100%; background:#222; border:1px solid #666; color:#fff; padding:8px; margin-top:5px;">
    <div id="debug-log" style="font-size:9px; color:#666; margin-top:5px;"></div>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const uploadBtn = document.getElementById('upload-to-host');
    const debugLog = document.getElementById('debug-log');

    function log(msg) { debugLog.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`; }
    function syncBank() {
      const t = parseFloat(localStorage.getItem('Tiffy_Harvest_Pending') || '0');
      const n = parseFloat(localStorage.getItem('TUSD_Nitro_Storage') || '0');
      document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${t.toFixed(2)}`;
      document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${n.toFixed(2)}`;
    }

    // Gatekeeper Logic
    function checkSovereignStatus() {
        const isVerified = localStorage.getItem("KYC_Verified_Hash");
        uploadBtn.style.display = isVerified ? 'block' : 'none';
    }

    window.onload = () => {
      syncBank();
      checkSovereignStatus();
      if(localStorage.getItem('sovereign_live_site')) projector.srcdoc = localStorage.getItem('sovereign_live_site');
    };

    document.getElementById('refresh-balances').onclick = syncBank;
    document.getElementById('toggle-ui').onclick = () => document.getElementById('ui-panel').classList.toggle('hidden');

    document.getElementById('prod-upload').onchange = (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (ev) => { localStorage.setItem('pending_store_upload', ev.target.result); log('Product Loaded.'); };
      reader.readAsText(file);
    };

    document.getElementById('upload-to-host').onclick = () => {
      const data = localStorage.getItem('pending_store_upload');
      if (data) {
        localStorage.setItem('sovereign_live_site', data);
        projector.srcdoc = data;
        log('Broadcast Active.');
      }
    };

    document.getElementById('chat-input').onkeypress = (e) => {
      if (e.key === 'Enter') {
        const msg = e.target.value;
        localStorage.setItem('room_chat_broadcast', JSON.stringify({msg, time: Date.now()}));
        e.target.value = '';
      }
    };
  </script>
</body>
</html>
