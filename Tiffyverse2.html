<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #ui-panel {
      position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.9);
      backdrop-filter: blur(12px); border: 1px solid var(--electric-blue);
      border-radius: 16px; padding: 16px; z-index: 100; max-width: 300px;
    }
    #ui-panel.hidden { transform: translateX(320px); }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 12px; margin: 6px 0; border-radius: 12px; width: 100%; cursor: pointer; }
    #projector-lens { width: 100%; height: 150px; background: #000; border: 1px solid #444; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0" wasd-controls-enabled="false"></a-camera>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    <button id="refresh-balances">Sync Bank Ledger</button>
    
    <!-- Projector Lens -->
    <div style="font-size:10px; color:#aaa; margin-top:10px;">LIVE PROJECTOR:</div>
    <iframe id="projector-lens"></iframe>

    <input type="file" id="prod-upload" style="display:none;">
    <button onclick="document.getElementById('prod-upload').click()">UPLOAD PRODUCT</button>
    
    <!-- Gatekeeper Controlled Buttons -->
    <button id="upload-to-host" style="background: var(--electric-blue);">UPLOAD TO HOST</button>
    <button id="visit-site" style="background: #28a745;">VISIT FULLSCREEN</button>

    <div id="chat-container" style="margin-top:10px; background:#000; border:1px solid #444; height:100px; overflow-y:auto; padding:5px; font-size:12px;"></div>
    <input type="text" id="chat-input" placeholder="Broadcast to room..." style="width:100%; background:#222; color:#fff; padding:8px; border:none; border-radius:8px;">
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const uploadBtn = document.getElementById('upload-to-host');

    function checkSovereignStatus() {
        const isVerified = localStorage.getItem("KYC_Verified_Hash");
        if (!isVerified) {
            uploadBtn.style.display = 'none';
        } else {
            uploadBtn.style.display = 'block';
        }
    }

    // Refresh projector from storage
    function refreshProjector() {
        const site = localStorage.getItem('sovereign_live_site');
        if (site) projector.srcdoc = site;
    }

    document.getElementById('upload-to-host').onclick = () => {
        const data = localStorage.getItem('pending_store_upload');
        if (data) {
            localStorage.setItem('sovereign_live_site', data);
            refreshProjector();
            alert('Website broadcast to room.');
        }
    };

    document.getElementById('visit-site').onclick = () => {
        const site = localStorage.getItem('sovereign_live_site');
        if (site) {
            const win = window.open();
            win.document.write(site);
            win.document.close();
        }
    };

    window.addEventListener('storage', (e) => {
        if (e.key === 'sovereign_live_site') refreshProjector();
        if (e.key === 'room_chat_broadcast') {
            const data = JSON.parse(e.newValue);
            document.getElementById('chat-container').innerHTML += `<div>Guest: ${data.msg}</div>`;
        }
    });

    window.onload = () => {
        checkSovereignStatus();
        refreshProjector();
    };
  </script>
</body>
</html>
