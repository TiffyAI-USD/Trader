<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Dashboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root { --electric-blue: #007BFF; --shocking-pink: #FF007F; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #ui-panel {
      position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 30, 0.9);
      backdrop-filter: blur(12px); border: 1px solid var(--electric-blue);
      border-radius: 16px; padding: 16px; z-index: 100; max-width: 300px;
    }
    #ui-panel.hidden { transform: translateX(320px); }
    #tiffy-counter, #tusd-counter { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--shocking-pink); text-align: center; margin-bottom: 5px; }
    button { background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); border: none; color: #fff; padding: 10px; margin: 4px 0; border-radius: 10px; width: 100%; cursor: pointer; font-size: 12px; }
    #projector-lens { width: 100%; height: 150px; background: #000; border: 1px solid #444; border-radius: 8px; margin-top: 5px; }
  </style>
</head>
<body>

  <div id="scene-container">
    <a-scene embedded background="color: #000" vr-mode-ui="enabled: false">
      <a-camera position="0 1.6 0" wasd-controls-enabled="false"></a-camera>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div id="tiffy-counter">TIFFYAI: 0.00</div>
    <div id="tusd-counter">TUSD Nitro: 0.00</div>
    <button id="refresh-balances">Sync Bank Ledger</button>
    
    <div style="font-size:10px; color:#aaa; margin-top:5px;">LIVE PROJECTOR:</div>
    <iframe id="projector-lens"></iframe>
    
    <button id="upload-to-host" style="background: var(--electric-blue);">UPLOAD TO HOST</button>
    <button id="visit-site" style="background: #28a745;">VISIT FULLSCREEN</button>

    <div id="chat-container" style="margin-top:10px; background:#000; border:1px solid #444; height:100px; overflow-y:auto; padding:5px; font-size:12px;"></div>
    <input type="text" id="chat-input" placeholder="Broadcast..." style="width:100%; background:#222; color:#fff; padding:8px; border:none; border-radius:8px; margin-top:5px;">
    <div id="debug-log" style="font-size:9px; color:#666; margin-top:5px;"></div>
  </div>

  <script>
    const projector = document.getElementById('projector-lens');
    const uploadBtn = document.getElementById('upload-to-host');
    const chatContainer = document.getElementById('chat-container');

    // Restoration of Core Logic
    function syncBank() {
      document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
      document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
    }

    function checkSovereignStatus() {
        const isVerified = localStorage.getItem("KYC_Verified_Hash");
        uploadBtn.style.display = isVerified ? 'block' : 'none';
    }

    function refreshProjector() {
        const site = localStorage.getItem('sovereign_live_site');
        if (site) projector.srcdoc = site;
    }

    document.getElementById('refresh-balances').onclick = syncBank;

    document.getElementById('upload-to-host').onclick = () => {
        const data = localStorage.getItem('pending_store_upload');
        if (data) {
            localStorage.setItem('sovereign_live_site', data);
            refreshProjector();
            alert('Website broadcast live.');
        }
    };

    document.getElementById('visit-site').onclick = () => {
        const site = localStorage.getItem('sovereign_live_site');
        if (site) {
            const win = window.open();
            win.document.write(site);
            win.document.close();
        }
    };

    // Chat logic preserved
    document.getElementById('chat-input').onkeypress = (e) => {
      if (e.key === 'Enter' && e.target.value.trim() !== '') {
        const msg = e.target.value.trim();
        localStorage.setItem('room_chat_broadcast', JSON.stringify({msg, time: Date.now()}));
        chatContainer.innerHTML += `<div>You: ${msg}</div>`;
        e.target.value = '';
      }
    };

    window.addEventListener('storage', (e) => {
        if (e.key === 'sovereign_live_site') refreshProjector();
        if (e.key === 'room_chat_broadcast') {
            const data = JSON.parse(e.newValue);
            chatContainer.innerHTML += `<div>Guest: ${data.msg}</div>`;
        }
    });

    window.onload = () => {
        syncBank();
        checkSovereignStatus();
        refreshProjector();
    };
  </script>
</body>
</html>
