<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TIFFY Trader • Sovereign Mesh Terminal</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --electric-blue: #00f0ff; --shocking-pink: #ff00aa; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; }
    #scene-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    #ui-panel { 
      position: fixed; top: 15px; right: 15px; 
      background: rgba(8, 12, 35, 0.45); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(0, 240, 255, 0.5); 
      border-radius: 16px; 
      padding: 14px; 
      z-index: 100; 
      width: 320px; 
      max-height: 90vh; 
      overflow-y: auto; 
    }

    button { 
      background: rgba(0, 240, 255, 0.25); 
      border: 1px solid rgba(0, 240, 255, 0.6); 
      color: #fff; 
      padding: 11px; 
      margin: 5px 0; 
      border-radius: 10px; 
      width: 100%; 
      cursor: pointer; 
      font-weight: bold; 
    }

    #toggle-ui { 
      position: fixed; top: 15px; left: 15px; z-index: 200; 
      background: rgba(255,0,170,0.7); 
      border: none; 
      width: 42px; 
      height: 42px; 
      border-radius: 50%; 
      cursor: pointer; 
      font-size: 20px; 
    }

    .stat-row { font-family: 'Orbitron', sans-serif; text-align: center; margin: 6px 0; color: #ff88cc; font-size: 1.05rem; }
    #chat-container { height: 140px; overflow-y: auto; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,240,255,0.3); padding: 8px; font-size: 11px; margin: 8px 0; }
    video { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(0,240,255,0.4); border-radius: 8px; margin: 5px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <button id="toggle-ui" onclick="document.getElementById('ui-panel').classList.toggle('hidden')">☰</button>
  
  <div id="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" background="color: #000000">
      <a-assets>
        <video id="bg-video" autoplay loop muted playsinline crossorigin="anonymous" src="https://raw.githubusercontent.com/TiffyAI-USD/Trader/refs/heads/main/Terminal1.mp4"></video>
      </a-assets>
      <a-sky src="#bg-video" rotation="0 -90 0" animation="property: rotation; from: 0 -90 0; to: 0 270 0; loop: true; dur: 90000; easing: linear"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity id="ar-portal" position="0 1.5 -3"></a-entity>
    </a-scene>
  </div>

  <div id="ui-panel">
    <div style="font-family:'Orbitron'; text-align:center; margin-bottom:10px; font-size:1.25rem; color:#00f0ff;">TIFFY MESH TERMINAL</div>
    
    <div class="stat-row" id="tiffy-counter">TIFFYAI: 0.00</div>
    <div class="stat-row" id="tusd-counter">TUSD Nitro: 0.00</div>

    <input type="text" id="search-bar" placeholder="Search Mesh..." style="width:100%; padding:8px; background:#111; color:#fff; border:1px solid #444; border-radius:8px;">
    <button onclick="searchMesh()">SEARCH MATRIX</button>
    <iframe id="projector-lens" allow="fullscreen" allowfullscreen="true" onclick="enterFullscreen()"></iframe>
    <div style="display:flex; gap:5px;">
        <button onclick="loadHome()" style="background:#666;">HOME</button>
        <button onclick="clearViewer()" style="background:#c00;">CLEAR</button>
    </div>
    <button onclick="document.getElementById('upload-modal').classList.remove('hidden')">UPLOAD STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Web-Store-App/v6.html', '_blank')" style="background: #28a745;">EDIT STORE</button>
    <button onclick="window.open('https://tiffyai-usd.github.io/Transact/Transfer-Cash.html', '_blank')" style="background: #555;">BANKING</button>
    <div style="margin-top:10px; font-size:10px; color:#aaa;">LIVE CHAT:</div>
    <div id="chat-container"></div>
    <input type="text" id="chat-input" placeholder="Type and Enter..." style="width:100%; padding:8px; background:#111; color:#fff; border:1px solid #666; border-radius:8px;">
    <button onclick="clearChat()" style="background:#444; font-size:10px; padding:5px;">CLEAR CHAT</button>
  </div>

  <div id="upload-modal" class="hidden">
    <h3>DEPLOY STORE</h3>
    <label>Thumbnail:</label><input type="file" id="thumb-input" accept="image/*" style="width:100%;">
    <label>HTML Storefront:</label><input type="file" id="html-input" accept=".html" style="width:100%;">
    <button onclick="deployStore()">CONFIRM DEPLOY</button>
    <button onclick="document.getElementById('upload-modal').classList.add('hidden')">CANCEL</button>
  </div>

  <script>
    // ==================== INDEXEDDB ====================
    const DB_NAME = 'TiffyStoreDB';
    const STORE_NAME = 'StoreData';

    async function getFromIDB(key) {
      try {
        const db = await new Promise((resolve) => {
          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME);
          request.onsuccess = (e) => resolve(e.target.result);
        });
        return new Promise(resolve => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result);
        });
      } catch (e) { return null; }
    }

    async function saveToIDB(key, value) {
      try {
        const db = await new Promise((resolve) => {
          const request = indexedDB.open(DB_NAME, 1);
          request.onsuccess = (e) => resolve(e.target.result);
        });
        return new Promise(resolve => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(value, key);
          tx.oncomplete = () => resolve(true);
        });
      } catch (e) { return false; }
    }

    // ==================== ORIGINAL CODE (with upload fix) ====================
    function startBackground() {
      const video = document.getElementById('bg-video');
      if (video) video.play().catch(() => {});
    }
    document.addEventListener('click', startBackground, { once: true });

    const projector = document.getElementById('projector-lens');
    const arPortal = document.getElementById('ar-portal');
    const peer = new Peer(); 
    let meshDir = {};

    function enterFullscreen() { 
        const el = document.getElementById('projector-lens'); 
        if (el.requestFullscreen) el.requestFullscreen(); 
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); 
    }

    function openStoreFullscreen(htmlContent) {
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    }

    async function deployStore() {
        const isVerified = localStorage.getItem("verified");
        if (!isVerified) {
            if (!document.getElementById('kyc-modal')) {
                const modal = document.createElement('div');
                modal.id = 'kyc-modal';
                modal.style.cssText = 'position:fixed; top:20%; left:30%; width:320px; background:#111; padding:20px; border:2px solid #FF007F; z-index:999; color:#fff; border-radius:15px; text-align:center;';
                modal.innerHTML = `
                    <h3 style="margin-bottom:15px;">ACTION REQUIRED</h3>
                    <p style="font-size:12px; margin-bottom:15px;">Top up your banking terminal with a minimum of 10 dollars to start receiving and sending payments instantly.. also do your KYC business registration and you good to go.</p>
                    <button onclick="window.open('https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=NVPAZWBES9WAS', '_blank')" style="background:#28a745; margin-bottom:10px;">TOP UP ACCOUNT</button>
                    <button onclick="window.open('https://tiffyai-usd.github.io/KYC/', '_blank')" style="background:#007BFF;">DO KYC REGISTRATION</button>
                    <button onclick="document.getElementById('kyc-modal').remove()" style="background:#444; margin-top:10px;">CLOSE</button>
                `;
                document.body.appendChild(modal);
            }
            return;
        }

        const hFile = document.getElementById('html-input').files[0];
        const tFile = document.getElementById('thumb-input').files[0];
        if (!hFile || !tFile) {
            alert("Please select both HTML and Thumbnail files.");
            return;
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
            const html = e.target.result;
            const tReader = new FileReader();
            tReader.onload = async (te) => {
                const thumb = te.target.result;
                const name = JSON.parse(localStorage.getItem('webstore_pro_draft') || '{"name":"Local Store"}').name || "My Store";
                const storeData = { id: peer.id, name, html, thumb, timestamp: Date.now() };
                meshDir[peer.id] = storeData;
                await saveToIDB('MESH_DIR', meshDir);
                localStorage.setItem('ar_store_html', html);
                renderPortals();
                document.getElementById('upload-modal').classList.add('hidden');
                projector.src = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
            };
            tReader.readAsDataURL(tFile);
        };
        reader.readAsText(hFile);
    }

    function renderPortals() {
        arPortal.innerHTML = '';
        Object.values(meshDir).forEach((biz, i) => {
            const el = document.createElement('a-plane');
            el.setAttribute('position', `${(i * 1.5) - 1} 0 0`);
            el.setAttribute('width', '1.2');
            el.setAttribute('height', '1.2');
            el.setAttribute('material', `src: url(${biz.thumb}); side: double`);
            el.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear');
            el.addEventListener('click', () => openStoreFullscreen(biz.html));
            arPortal.appendChild(el);
        });
    }

    function searchMesh() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const found = Object.values(meshDir).find(b => b.name?.toLowerCase().includes(query));
        if (found) { 
            projector.src = URL.createObjectURL(new Blob([found.html], {type: 'text/html'})); 
        } else { 
            alert("Node not found."); 
        }
    }

    function addChatMessage(msg, save = true) {
        const div = document.createElement('div');
        div.textContent = "> " + msg;
        document.getElementById('chat-container').appendChild(div);
        if (save) {
            let hist = JSON.parse(localStorage.getItem('chat_hist') || '[]');
            hist.push(msg);
            localStorage.setItem('chat_hist', JSON.stringify(hist));
        }
    }

    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim() !== '') { 
            addChatMessage(e.target.value); 
            e.target.value = ''; 
        }
    });

    function loadHome() { 
        projector.src = 'https://tiffyai-usd.github.io/Web-Store-App/v6.html'; 
    }
    function clearViewer() { projector.src = ''; }
    function clearChat() { 
        localStorage.removeItem('chat_hist'); 
        document.getElementById('chat-container').innerHTML = ''; 
    }

    peer.on('open', (id) => {
        console.log("Connected with ID:", id);
        renderPortals();
    });

    window.onload = async () => {
        const savedMesh = await getFromIDB('MESH_DIR');
        if (savedMesh) meshDir = savedMesh;

        renderPortals();
        document.getElementById('tiffy-counter').textContent = `TIFFYAI: ${localStorage.getItem('Tiffy_Harvest_Pending') || '0.00'}`;
        document.getElementById('tusd-counter').textContent = `TUSD Nitro: ${localStorage.getItem('TUSD_Nitro_Storage') || '0.00'}`;
        
        const savedHtml = localStorage.getItem('ar_store_html');
        if (savedHtml) { 
            projector.src = URL.createObjectURL(new Blob([savedHtml], {type: 'text/html'})); 
        } else { 
            loadHome(); 
        }
        
        const hist = JSON.parse(localStorage.getItem('chat_hist') || '[]');
        hist.forEach(m => addChatMessage(m, false));
        setTimeout(startBackground, 800);
    };
  </script>
</body>
</html>
