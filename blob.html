<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Beacon & Blob Sync Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h2 { margin: 0 0 8px 0; color: #38bdf8; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            background: #ef4444;
            color: white;
            margin-bottom: 12px;
        }
        .status-badge.connected {
            background: #22c55e;
        }
        .log-container {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <div>
        <h2>Store Beacon & Blob Messaging Bridge</h2>
        <p style="color: #94a3b8; margin: 0;">Open this file in two separate browser windows to test the P2P beacon handshake and binary blob message translation.</p>
    </div>

    <div class="card">
        <div id="statusBadge" class="status-badge">Searching for Peer (Beacon Active)...</div>
        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 6px;">Connection Activity Log:</div>
        <div id="logContainer" class="log-container"></div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; font-size: 16px; color: #e2e8f0;">Send Translated JSON Blob Message</h3>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Type a message to blob and sync..." disabled>
            <button id="sendBtn" onclick="sendBlobMessage()" disabled>Send Blob</button>
        </div>
    </div>

<script>
    // Unique identifier for this browser instance/tab
    const clientId = 'Client_' + Math.random().toString(36).substring(2, 7);
    const channel = new BroadcastChannel('store_ip_beacon_sim');
    
    let isConnected = false;
    let peerId = null;
    let pingInterval = null;

    const logContainer = document.getElementById('logContainer');
    const statusBadge = document.getElementById('statusBadge');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function log(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const color = type === 'success' ? '#34d399' : type === 'error' ? '#f87171' : '#a7f3d0';
        logContainer.innerHTML += `<div style="color: ${color}">[${timestamp}] [${clientId}] ${message}</div>`;
        logContainer.scrollTop = logContainer.scrollHeight;
    }

    log("Beacon initialized. Starting radar ping sequence...");

    // 1. Start Beacon Ping
    function startPing() {
        pingInterval = setInterval(() => {
            if (!isConnected) {
                log("📡 Emitting Beacon PING...");
                channel.postMessage({ type: 'PING', sender: clientId });
            }
        }, 2000);
    }

    startPing();

    // 2. Listen for network signals
    channel.onmessage = async (event) => {
        const { type, sender, payload } = event.data;
        if (sender === clientId) return; // Ignore own echoes

        if (type === 'PING' && !isConnected) {
            log(`📥 Received PING from peer: ${sender}. Sending PONG response.`);
            channel.postMessage({ type: 'PONG', sender: clientId, target: sender });
            establishConnection(sender);
        } 
        else if (type === 'PONG' && !isConnected) {
            log(`📥 Received PONG response from peer: ${sender}. Handshake complete!`);
            establishConnection(sender);
        }
        else if (type === 'BLOB_SYNC' && isConnected) {
            log(`📦 Received raw binary blob payload from ${sender}. Unpacking...`);
            
            // Translate binary blob back to readable text / JSON
            const textData = await payload.text();
            const json = JSON.parse(textData);
            
            log(`✨ Successfully translated blob into JSON: "${json.text}" (Source IP Simulation: ${json.ip})`, 'success');
        }
    };

    function establishConnection(targetPeer) {
        if (!isConnected) {
            isConnected = true;
            peerId = targetPeer;
            clearInterval(pingInterval);
            
            statusBadge.className = "status-badge connected";
            statusBadge.innerText = `Connected to Peer: ${peerId}`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            log(`✅ Connection bridge established with ${peerId}!`, 'success');
        }
    }

    // 3. Package and Send as a Translated Binary Blob
    async function sendBlobMessage() {
        const textVal = messageInput.value.trim();
        if (!textVal) return;

        log(`OUTGOING: Packaging message into JSON structure...`);
        const messageObject = {
            sender: clientId,
            ip: "192.168.1." + Math.floor(Math.random() * 200 + 10), // Simulated peer IP
            text: textVal,
            timestamp: Date.now()
        };

        const jsonString = JSON.stringify(messageObject);

        // Convert JSON string to binary Blob data layer
        log(`OUTGOING: Converting JSON text to binary Blob...`);
        const binaryBlob = new Blob([jsonString], { type: 'application/json' });

        log(`OUTGOING: Transmitting blob across bridge channel to ${peerId}...`);
        channel.postMessage({
            type: 'BLOB_SYNC',
            sender: clientId,
            payload: binaryBlob
        });

        log(`🚀 Blob successfully transmitted!`, 'success');
        messageInput.value = '';
    }
</script>

</body>
</html>
